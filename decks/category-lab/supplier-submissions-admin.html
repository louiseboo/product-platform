<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>产品信息收件箱</title>
  <style>
    :root {
      --paper: #f7f4ee;
      --panel: #fffdf8;
      --side: #f3efe6;
      --ink: #2b2620;
      --body: #4a4438;
      --muted: #6b6254;
      --faint: #9a9081;
      --line: #e6e0d4;
      --line-soft: #eee8dc;
      --button-line: #d4cbb9;
      --pending: #a4550f;
      --pending-bg: #f3e3cd;
      --confirmed: #3d7a4a;
      --company-bg: #f3efe6;
      --company-active-bg: #eadbc0;
      --product-active-bg: #e7efe5;
      --product-active-line: #6f8068;
      --danger: #c9503f;
      --danger-dark: #a63a2b;
      --danger-copy: #7a4238;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif;
      --serif: var(--sans);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.5;
    }
    button, input, select, textarea, a {
      font: inherit;
    }
    button, .button-link {
      appearance: none;
      min-height: 38px;
      border: 1px solid var(--button-line);
      border-radius: 5px;
      background: #fffdf8;
      color: var(--ink);
      cursor: pointer;
      font-weight: 700;
      padding: 8px 12px;
      text-decoration: none;
      white-space: nowrap;
    }
    button.primary, .button-link.primary {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }
    button.danger {
      color: var(--danger);
    }
    button:disabled {
      cursor: not-allowed;
      opacity: .48;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--button-line);
      border-radius: 5px;
      background: #fffdf8;
      color: var(--ink);
      padding: 8px 10px;
      outline: none;
    }
    input, select { min-height: 36px; }
    textarea {
      min-height: 86px;
      resize: vertical;
      line-height: 1.7;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #b89254;
      box-shadow: 0 0 0 3px rgba(184, 146, 84, .14);
    }
    .hidden { display: none !important; }

    .auth-page {
      min-height: 100%;
      padding: 28px;
    }
    .auth-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      max-width: 980px;
      margin: 0 auto 18px;
    }
    .auth-header h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 26px;
      line-height: 1.2;
    }
    .auth-header p,
    .auth-copy {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .auth-card {
      width: min(620px, 100%);
      margin: 0 auto;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 26px;
    }
    .auth-title {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 700;
    }
    .auth-card label {
      display: block;
      margin: 16px 0 6px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
    }
    .auth-actions {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .inbox-app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      overflow: hidden;
      background: var(--paper);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 66px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      padding: 14px 20px 12px;
    }
    .top-title {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }
    .top-title h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
    }
    .top-title span {
      color: var(--faint);
      font-size: 11px;
      white-space: nowrap;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .top-actions input {
      width: 220px;
      min-height: 34px;
      background: transparent;
    }
    .top-actions button,
    .top-actions .button-link {
      min-height: 34px;
      padding: 6px 10px;
      background: transparent;
      font-size: 12px;
    }
    .filterbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 46px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      padding: 0 20px;
    }
    .filter-tabs {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .filter-tab {
      min-height: auto;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .filter-tab.active {
      color: var(--ink);
    }
    .filter-tab span {
      color: var(--faint);
      font-weight: 600;
    }
    .sort-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--faint);
      font-size: 11px;
      white-space: nowrap;
    }
    .sort-control select {
      width: auto;
      min-height: 32px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 28px 4px 9px;
    }
    .message {
      display: none;
      border-bottom: 1px solid var(--line);
      background: #fffaf1;
      color: var(--muted);
      padding: 10px 20px;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .message.show { display: block; }
    .message.error {
      background: #fff4f1;
      color: var(--danger-dark);
    }
    .message.success {
      background: #f5fbf3;
      color: var(--confirmed);
    }
    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 400px minmax(0, 1fr) 260px;
      overflow: hidden;
    }
    .list-pane,
    .reading-pane,
    .meta-sidebar {
      min-height: 0;
      overflow-y: auto;
    }
    .list-pane {
      border-right: 1px solid var(--line);
      background: var(--paper);
    }
    .submission-list {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
    }
    .test-category-section {
      background: var(--paper);
    }
    .test-category-section + .test-category-section {
      border-top: 1px solid var(--line);
    }
    .test-category-bar {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      width: 100%;
      min-height: 44px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 16px 9px 14px;
      border-top: 1px solid;
      border-right: 0;
      border-bottom: 1px solid;
      border-left: 3px solid;
      border-radius: 0;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .test-category-bar.campaign-section {
      border-color: #b58a4a;
      background: #efe4cf;
      color: #4b3822;
    }
    .test-category-bar.proposal-section {
      border-color: #668069;
      background: #e4ebe4;
      color: #2f4a35;
    }
    .test-category-bar.maintenance-section {
      border-color: #8b6d5d;
      background: #ebe3de;
      color: #4c4039;
    }
    .test-category-bar.special-section {
      border-color: #7d748b;
      background: #eae6ef;
      color: #51475d;
    }
    .test-category-bar.uncategorized-section {
      border-color: #8e877a;
      background: #eeeae3;
      color: #514c44;
    }
    .test-category-title {
      font-size: 13px;
      font-weight: 800;
    }
    .test-category-meta {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      color: currentColor;
      font-size: 11px;
      font-weight: 650;
      opacity: .78;
      text-align: right;
    }
    .test-category-caret {
      display: inline-grid;
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      place-items: center;
      font-size: 12px;
      line-height: 1;
      transition: transform .16s ease;
    }
    .test-category-bar[aria-expanded="false"] .test-category-caret {
      transform: rotate(-90deg);
    }
    .test-category-bar:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: -3px;
    }
    .test-category-note {
      border-right: 1px solid currentColor;
      padding-right: 8px;
    }
    .campaign-group-bar,
    .supplier-group-bar,
    .product-type-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line-soft);
    }
    .campaign-group-bar {
      width: 100%;
      min-height: 40px;
      border: 0;
      border-left: 3px solid #9b7642;
      border-bottom: 1px solid var(--line-soft);
      border-radius: 0;
      background: #fffaf0;
      padding: 8px 14px 8px 13px;
      color: #493820;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .campaign-group-bar strong {
      min-width: 0;
      overflow-wrap: anywhere;
      white-space: normal;
      font-family: var(--serif);
      font-size: 13px;
      line-height: 1.45;
    }
    .campaign-group-bar span,
    .product-type-bar span {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 650;
    }
    .campaign-group-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .campaign-group-caret {
      display: inline-grid;
      width: 18px;
      height: 18px;
      place-items: center;
      font-size: 11px;
      line-height: 1;
      transition: transform .16s ease;
    }
    .campaign-group-bar[aria-expanded="false"] .campaign-group-caret {
      transform: rotate(-90deg);
    }
    .campaign-group-bar:focus-visible {
      outline: 2px solid #9b7642;
      outline-offset: -3px;
    }
    .supplier-group-section + .supplier-group-section {
      border-top: 1px solid var(--line);
    }
    .supplier-group-bar {
      width: 100%;
      min-height: 40px;
      border: 0;
      border-left: 3px solid #c9503f;
      border-bottom: 1px solid var(--line-soft);
      border-radius: 0;
      background: #fff8f5;
      padding: 8px 14px 8px 13px;
      color: #673126;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .supplier-group-bar strong {
      min-width: 0;
      overflow: hidden;
      font-family: var(--serif);
      font-size: 13px;
      line-height: 1.45;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .supplier-group-meta {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 650;
    }
    .supplier-group-caret {
      display: inline-grid;
      width: 18px;
      height: 18px;
      place-items: center;
      font-size: 11px;
      line-height: 1;
      transition: transform .16s ease;
    }
    .supplier-group-bar[aria-expanded="false"] .supplier-group-caret {
      transform: rotate(-90deg);
    }
    .supplier-group-bar:focus-visible {
      outline: 2px solid #c9503f;
      outline-offset: -3px;
    }
    .supplier-group-bar.proposal-supplier-group-bar {
      border-left-color: #668069;
      background: #f6faf6;
      color: #2f4a35;
    }
    .supplier-group-bar.proposal-supplier-group-bar:focus-visible {
      outline-color: #668069;
    }
    .product-type-bar {
      min-height: 32px;
      background: #f5f2eb;
      padding: 6px 15px 6px 18px;
      color: var(--ink-soft);
    }
    .product-type-bar strong {
      font-size: 11.5px;
      font-weight: 800;
    }
    button.product-type-bar {
      width: 100%;
      border-top: 0;
      border-right: 0;
      border-left: 0;
      border-radius: 0;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .product-type-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .product-type-caret {
      display: inline-grid;
      width: 18px;
      height: 18px;
      place-items: center;
      color: var(--faint);
      font-size: 11px;
      line-height: 1;
      transition: transform .16s ease;
    }
    button.product-type-bar[aria-expanded="false"] .product-type-caret {
      transform: rotate(-90deg);
    }
    button.product-type-bar:focus-visible {
      outline: 2px solid var(--ink-soft);
      outline-offset: -3px;
    }
    .campaign-group-section + .campaign-group-section {
      border-top: 1px solid var(--line);
    }
    .product-type-section + .product-type-section {
      border-top: 1px solid var(--line-soft);
    }
    .pending-supplier-group + .pending-supplier-group {
      border-top: 2px solid var(--line);
    }
    .pending-supplier-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 16px 18px;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: var(--side);
      color: var(--ink);
      text-align: left;
      white-space: normal;
      cursor: pointer;
    }
    .pending-supplier-name {
      min-width: 0;
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .pending-supplier-meta {
      flex: none;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .pending-supplier-head:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: -3px;
    }
    .pending-supplier-group[aria-expanded="false"] > .pending-supplier-body {
      display: none;
    }
    .pending-batch-item-head,
    .pending-batch-item-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .pending-batch-item-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }
    .pending-batch-item {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line-soft);
      border-radius: 0;
      background: transparent;
      padding: 14px 18px 14px 24px;
      color: var(--ink);
      text-align: left;
      white-space: normal;
    }
    .pending-batch-item.active {
      background: var(--product-active-bg);
      box-shadow: inset 3px 0 0 var(--product-active-line);
    }
    .pending-batch-product-name {
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 700;
    }
    .pending-batch-item-summary {
      display: -webkit-box;
      margin-top: 7px;
      overflow: hidden;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.55;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .product-group {
      border-bottom: 1px solid var(--line);
    }
    .product-group.active {
      background: rgba(255, 253, 248, .54);
    }
    .product-group-head {
      display: block;
      width: 100%;
      min-height: 82px;
      border: 0;
      border-left: 3px solid transparent;
      border-radius: 0;
      background: transparent;
      padding: 13px 15px 12px;
      text-align: left;
      white-space: normal;
    }
    .product-group.active .product-group-head {
      border-left-color: var(--ink);
      background: var(--panel);
    }
    .product-group-title-row,
    .product-group-meta-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .product-group-title {
      min-width: 0;
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
    }
    .product-group-title-actions {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
    }
    .product-paused-badge {
      display: inline-flex;
      min-height: 22px;
      align-items: center;
      border: 1px solid #c9503f;
      border-radius: 999px;
      background: #fff4f1;
      color: #a63a2b;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.4;
    }
    .product-group-caret {
      flex: 0 0 auto;
      color: var(--faint);
      font-size: 12px;
      transition: transform .16s ease;
    }
    .product-group.collapsed .product-group-caret {
      transform: rotate(-90deg);
    }
    .product-group-meta-row {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 600;
    }
    .product-group-status {
      flex: 0 0 auto;
      color: var(--faint);
      font-weight: 500;
    }
    .product-version-list {
      padding: 0 0 8px 18px;
    }
    .product-group.collapsed .product-version-list {
      display: none;
    }
    .version-item {
      display: block;
      width: 100%;
      min-height: 78px;
      border: 0;
      border-left: 2px solid var(--line);
      border-radius: 0;
      background: transparent;
      padding: 10px 14px 10px 13px;
      text-align: left;
      white-space: normal;
    }
    .version-item + .version-item {
      border-top: 1px solid var(--line-soft);
    }
    .version-item.active {
      border-left-color: var(--ink);
      background: var(--panel);
    }
    .version-item.filter-muted {
      opacity: .46;
    }
    .version-item-head,
    .version-item-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .version-item-version {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 800;
    }
    .version-item-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }
    .version-item-summary {
      display: -webkit-box;
      overflow: hidden;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.45;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      white-space: pre-line;
    }
    .item-time {
      flex: 0 0 auto;
      color: var(--faint);
      font-size: 11px;
      font-weight: 500;
    }
    .status-word.pending { color: var(--pending); }
    .status-word.confirmed { color: var(--confirmed); }
    .empty-list,
    .empty-detail {
      padding: 24px;
      color: var(--faint);
      font-size: 13px;
    }
    .reading-pane {
      background: var(--paper);
      padding: 28px 36px 42px;
    }
    .reading-inner {
      max-width: 680px;
      margin: 0 auto;
    }
    .detail-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .detail-title-row h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 700;
      line-height: 1.25;
    }
    .version-stage-badge {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      border: 1px solid #ccb98f;
      border-radius: 999px;
      background: #f2ead8;
      color: #6e5426;
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.4;
      vertical-align: middle;
    }
    .version-stage-preview {
      min-height: 34px;
      border-left: 2px solid #b89254;
      background: #f8f2e6;
      color: var(--muted);
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.5;
    }
    .detail-meta {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }
    .version-switcher {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 14px 0 18px;
      overflow-x: auto;
      padding: 2px 0 4px;
    }
    .version-switch-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      padding: 5px 9px;
      border-color: var(--button-line);
      background: transparent;
      color: var(--muted);
      font-size: 11.5px;
    }
    .version-switch-button.active {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }
    .version-switch-button.active .version-stage-badge {
      border-color: rgba(255, 255, 255, .48);
      background: rgba(255, 255, 255, .12);
      color: #fff;
    }
    .image-strip {
      display: flex;
      align-items: stretch;
      gap: 12px;
      margin: 12px 0 24px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .image-item {
      flex: 0 0 auto;
      display: grid;
      gap: 6px;
      margin: 0;
    }
    .image-button {
      appearance: none;

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));

    function escapeAttr(value) {

      return text || fallback;
    }

    function dateText(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString("zh-CN", { hour12: false });
    }

    function relativeTime(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      const diff = Date.now() - date.getTime();
      const minutes = Math.floor(diff / 60000);
      if (minutes < 1) return "刚刚";
      if (minutes < 60) return `${minutes} 分钟前`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours} 小时前`;
      const days = Math.floor(hours / 24);
      if (days < 7) return `${days} 天前`;
      return `${date.getMonth() + 1}/${String(date.getDate()).padStart(2, "0")}`;
    }

          sourceKey: imagePathKey(image, index),
          previewUrl: cloudbaseImageUrl(image.fileID) || image.publicUrl || image.url || ""
        }))
      };
      return adminImageDraft;

    function ensureAdminImageDraft(row = activeRecord()) {
      if (!row) return null;
      if (!adminImageDraft || adminImageDraft.recordId !== row.id) return resetAdminImageDraft(row);
      return adminImageDraft;

        files: newItems.map(item => item.file),
        retainedCount: draft.items.filter(item => item.kind === "existing").length,
        imageOrder: draft.items.map(item => item.kind === "existing"
          ? { kind: "existing", key: item.sourceKey }
          : { kind: "new", index: newIndexes.get(item.draftKey) })
      };

      const current = adminImageDraft.items.map(item => item.kind === "existing" ? item.sourceKey : item.draftKey);
      return original.length !== current.length || original.some((key, index) => key !== current[index]);
    }

        body: JSON.stringify({ action, adminCode: cloudbaseAdminCode, ...payload })

      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || `请求失败（${response.status}）`);

      return result.data;
