    function hasUnsavedChanges() {
      const row = activeRecord();
      if (!row || appPanel.classList.contains("hidden")) return false;
      const payload = activePayload();
      const fieldsChanged = EDITABLE_RECORD_FIELDS.some(field => {
        const original = field === "campaign_year"
          ? effectiveCampaignYear(row)
          : field === "campaign"
            ? isOraNewTest(row.test_category) ? String(row.campaign || "") : recordCampaignName(row)
            : field === "test_category" ? testCategoryLabel(row.test_category)
              : field === "project_name" ? projectNameForRecord(row) : row[field];
        return comparableRecordValue(payload[field]) !== comparableRecordValue(original);
      });
      return fieldsChanged || adminImageDraftChanged(row);
    }

    function requestUnsavedDecision() {
      if (!hasUnsavedChanges()) return Promise.resolve("continue");
      if (unsavedDecisionPromise) return unsavedDecisionPromise;
      unsavedChangesModal.classList.remove("hidden");
      unsavedDecisionPromise = new Promise(resolve => {
        unsavedDecisionResolve = resolve;
      });
      return unsavedDecisionPromise;
    }

    function resolveUnsavedDecision(decision) {
      if (!unsavedDecisionResolve) return;
      const resolve = unsavedDecisionResolve;
      unsavedDecisionResolve = null;
      unsavedDecisionPromise = null;
      unsavedChangesModal.classList.add("hidden");
      resolve(decision);
    }

    async function runWithUnsavedGuard(action) {
      if (!hasUnsavedChanges()) {
        await action();
        return true;
      }
      const decision = await requestUnsavedDecision();
      if (decision === "cancel") return false;
      if (decision === "save") {
        try {
          await saveRow();
          showMessage("修改已保存。", "success");
        } catch (error) {
          showMessage(error.message || "保存失败，已保留当前修改。", "error");
          return false;
        }
      } else {
        clearAdminImageDraft();
      }
      await action();
      return true;
    }

    function installHistoryGuard() {
      if (historyGuardInstalled) return;
      historyGuardInstalled = true;
      history.replaceState({ ...(history.state || {}), categorylabInboxBase: true }, "", location.href);
      history.pushState({ categorylabInboxGuard: true }, "", location.href);
    }

    async function handleHistoryBack() {
      if (!historyGuardInstalled || historyExitInProgress || history.state?.categorylabInboxGuard) return;
      history.pushState({ categorylabInboxGuard: true }, "", location.href);
      if (!hasUnsavedChanges()) {
        historyExitInProgress = true;
        history.go(-2);
        return;
      }
      await runWithUnsavedGuard(async () => {
        historyExitInProgress = true;
        history.go(-2);
      });
    }

    function fileToImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    async function compressAdminImage(file) {
      const rawDataUrl = await fileToImage(file);
      const image = new Image();
      await new Promise((resolve, reject) => {
        image.onload = resolve;
        image.onerror = () => reject(new Error("图片无法读取，请使用 JPG、PNG 或 WebP 格式。"));
        image.src = rawDataUrl;
      });
      const maxSide = 1400;
      const ratio = Math.min(1, maxSide / Math.max(image.width, image.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(image.width * ratio);
      canvas.height = Math.round(image.height * ratio);
      canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.78));
      return blob || file;
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(blob);
      });
    }

    async function adminImagePayloads(files, existingCount) {
      const availableSlots = Math.max(0, 6 - existingCount);
      if (files.length > availableSlots) throw new Error(`当前已有 ${existingCount} 张图片，最多还能新增 ${availableSlots} 张。`);
      const images = [];
      for (const file of files) {
        const blob = await compressAdminImage(file);
        images.push({
          name: file.name,
          type: "image/jpeg",
          dataUrl: await blobToDataUrl(blob)
        });
      }
      return images;
    }

      preview.textContent = stage

        : "尚未识别版本阶段。进入众测、中试或大生产后自动标记。";
    }

    async function saveRow(id = activeRecordId, override = {}) {
      if (!roleCanEdit() || !id) return null;
      const existing = activeRecord() || {};
      const payload = { ...activePayload(), ...override };
      const imagePlan = adminImageSavePlan(existing);
      const imageChanged = adminImageDraftChanged(existing);
      if (imageChanged && !cloudbaseReady) throw new Error("当前备份环境暂不支持修改收件箱图片。");
      const images = imagePlan.files.length
        ? await adminImagePayloads(imagePlan.files, imagePlan.retainedCount)
        : [];
      let data;
      if (cloudbaseReady) {
        const response = await cloudbaseRequest("adminUpdate", {
          id,
          payload,
          images,
          imageOrder: imagePlan.imageOrder
        });
        data = response.record;
      } else {
        const response = await client
          .from(TABLE)
          .update(payload)
          .eq("id", id)
          .select("*")
          .single();
        if (response.error) throw response.error;
        data = response.data;
      }
      const index = records.findIndex(row => row.id === id);
      if (index >= 0) records[index] = { ...existing, ...payload, ...(data || {}), id };
      if (supplierEditOpen) resetAdminImageDraft(records[index] || data);
      else clearAdminImageDraft();
      renderAll(id);
      return records[index] || data;
    }

    async function confirmActiveRow(id = activeRecordId) {
      if (!roleCanEdit() || !id) return null;
      const confirmingFromPending = statusFilter === "待处理";
      const nextId = confirmingFromPending ? nextPendingRecordId(id) : id;
      const updated = await saveRow(id, { status: "已确认" });
      if (confirmingFromPending) {
        statusFilter = "待处理";
        renderAll(nextId);
      } else {
        statusFilter = "已确认";
        renderAll(id);
      }
      return updated;

    async function deleteRow(id = activeRecordId) {
      if (!roleCanEdit() || !id) return;
      const row = recordById(id);
      const ok = window.confirm(`确认删除这条产品信息？\n${row?.product_name || ""}`);
      if (!ok) return;
      if (cloudbaseReady) {
        await cloudbaseRequest("adminDelete", { id });
      } else {
        const { error } = await client
          .from(TABLE)
          .delete()
          .eq("id", id);
        if (error) throw error;
      }
      records = records.filter(item => item.id !== id);
      renderAll("");
      showMessage("已删除。", "success");

    function csvEscape(value) {
      const text = String(value || "");
      return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function exportCsv() {
      const headers = [
        "品名",
        "供应商",
        "版本",
        "版本阶段",
        "提交编号",
        "送样时间",
        "产品类型",
        "测试类别",
        "项目名称",
        "档期年份",
        "档期名称",
        "老品维护测试目的",
        "本版调整点",
        "产品规格（g）",
        "长度（mm）",
        "宽度（mm）",
        "高度（mm）",
        "产品结构",
        "产品照",
        "测试场景 / 反馈来源",
        "测试反馈",
        "本轮结论",
        "下一步改进方向",
        "报价（元，含税含运）",
        "核心原料及卖点",
        "关键卡点 / 备注",
        "状态"
      ];
      const rows = visibleRecords().map(row => [
        row.product_name,
        row.supplier_name,
        row.version_label,
        deriveVersionStage(row, records),
        row.followup_code,
        row.sample_date,
        row.product_type,
        testCategoryLabel(row.test_category),
        isOraNewTest(row.test_category) ? projectNameForRecord(row) : "",
        effectiveCampaignYear(row),
        recordPeriodValue(row),
        row.maintenance_purpose,
        row.version_change,
        row.finished_spec,
        row.length_mm,
        row.width_mm,
        row.height_mm,
        row.ingredients_structure,
        imageUrls(row).join(" "),
        row.tasting_scene,
        row.tasting_feedback,
        row.round_conclusion,
        row.next_step_direction,
        row.quote_rmb,
        row.core_ingredients_selling_points,
        row.key_blocker,
        row.status
      ]);
      const csv = [headers, ...rows].map(row => row.map(csvEscape).join(",")).join("\n");
      const blob = new Blob(["\ufeff", csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `产品信息收件箱_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

  <script id="inbox-column-resize">
    (() => {
      const workspace = document.querySelector(".workspace");
      const resizers = Array.from(document.querySelectorAll("[data-column-resizer]"));
      if (!workspace || !resizers.length) return;

      const storageKey = "categorylab-inbox-column-widths-v1";
      const defaults = { left: 352, right: 238 };
      const limits = {
        left: { min: 260, max: 560 },
        right: { min: 200, max: 400 },
        centerMin: 420,
        handles: 16
      };
      const desktopQuery = window.matchMedia("(min-width: 1101px)");
      let widths = { ...defaults };
      let dragState = null;
      let resizeFrame = 0;

      try {
        const saved = JSON.parse(window.localStorage.getItem(storageKey) || "null");
        if (Number.isFinite(saved?.left)) widths.left = saved.left;
        if (Number.isFinite(saved?.right)) widths.right = saved.right;
      } catch {}

      function bounded(value, min, max) {
        return Math.min(Math.max(value, min), Math.max(min, max));
      }

      function normalizeWidths() {
        widths.left = bounded(widths.left, limits.left.min, limits.left.max);
        widths.right = bounded(widths.right, limits.right.min, limits.right.max);
        if (!desktopQuery.matches) return;

        const available = Math.max(
          limits.left.min + limits.right.min,
          workspace.getBoundingClientRect().width - limits.centerMin - limits.handles
        );
        let overflow = widths.left + widths.right - available;
        if (overflow <= 0) return;

        const rightReduction = Math.min(overflow, widths.right - limits.right.min);
        widths.right -= rightReduction;
        overflow -= rightReduction;
        if (overflow > 0) widths.left = Math.max(limits.left.min, widths.left - overflow);
      }

      function updateSeparatorState() {
        resizers.forEach(resizer => {
          const side = resizer.dataset.columnResizer;
          const rule = limits[side];
          resizer.setAttribute("aria-valuemin", String(rule.min));
          resizer.setAttribute("aria-valuemax", String(rule.max));
          resizer.setAttribute("aria-valuenow", String(Math.round(widths[side])));
          resizer.setAttribute("aria-valuetext", `${Math.round(widths[side])} 像素`);
        });
      }

      function renderWidths({ persist = false } = {}) {
        normalizeWidths();
        workspace.style.setProperty("--inbox-left-width", `${Math.round(widths.left)}px`);
        workspace.style.setProperty("--inbox-right-width", `${Math.round(widths.right)}px`);
        updateSeparatorState();
        if (!persist) return;
        try {
          window.localStorage.setItem(storageKey, JSON.stringify({
            left: Math.round(widths.left),
            right: Math.round(widths.right)
          }));
        } catch {}
      }

      function setWidth(side, value, persist = false) {
        if (!desktopQuery.matches) return;
        const otherSide = side === "left" ? "right" : "left";
        const maxBySpace = workspace.getBoundingClientRect().width
          - widths[otherSide]
          - limits.centerMin
          - limits.handles;
        widths[side] = bounded(value, limits[side].min, Math.min(limits[side].max, maxBySpace));
        renderWidths({ persist });
      }

      function finishDrag(pointerId) {
        if (!dragState || (pointerId != null && dragState.pointerId !== pointerId)) return;
        dragState.resizer.classList.remove("active");
        document.body.classList.remove("inbox-column-resizing");
        dragState = null;
        renderWidths({ persist: true });
      }

      resizers.forEach(resizer => {
        const side = resizer.dataset.columnResizer;
        resizer.addEventListener("pointerdown", event => {
          if (!desktopQuery.matches || (event.pointerType === "mouse" && event.button !== 0)) return;
          dragState = {
            pointerId: event.pointerId,
            resizer,
            side,
            startX: event.clientX,
            startWidth: widths[side]
          };
          resizer.classList.add("active");
          document.body.classList.add("inbox-column-resizing");
          resizer.setPointerCapture?.(event.pointerId);
          event.preventDefault();
        });

        resizer.addEventListener("dblclick", () => {
          widths[side] = defaults[side];
          renderWidths({ persist: true });
        });

        resizer.addEventListener("keydown", event => {
          if (!desktopQuery.matches || !["ArrowLeft", "ArrowRight"].includes(event.key)) return;
          const movement = (event.key === "ArrowRight" ? 1 : -1) * (event.shiftKey ? 30 : 10);
          const nextWidth = side === "left" ? widths[side] + movement : widths[side] - movement;
          setWidth(side, nextWidth, true);
          event.preventDefault();
          event.stopPropagation();
        });
      });

      window.addEventListener("pointermove", event => {
        if (!dragState || dragState.pointerId !== event.pointerId) return;
        const movement = event.clientX - dragState.startX;
        const nextWidth = dragState.side === "left"
          ? dragState.startWidth + movement
          : dragState.startWidth - movement;
        setWidth(dragState.side, nextWidth);
      });
      window.addEventListener("pointerup", event => finishDrag(event.pointerId));
      window.addEventListener("pointercancel", event => finishDrag(event.pointerId));
      window.addEventListener("resize", () => {
        window.cancelAnimationFrame(resizeFrame);
        resizeFrame = window.requestAnimationFrame(() => renderWidths());
      });
      desktopQuery.addEventListener?.("change", () => renderWidths());

      renderWidths();
    })();
  </script>
</body>
</html>
