      return `<input data-field="${escapeAttr(field)}" type="${escapeAttr(type)}" value="${escapeAttr(value || "")}" placeholder="${escapeAttr(placeholder)}" ${roleCanEdit() ? "" : "disabled"}>`;
    }

    function fieldTextarea(field, value, placeholder = "", rows = 3) {
      return `<textarea data-field="${escapeAttr(field)}" rows="${rows}" placeholder="${escapeAttr(placeholder)}" ${roleCanEdit() ? "" : "disabled"}>${escapeHtml(value || "")}</textarea>`;
    }

    function fieldSelect(field, options, selected) {
      const html = field === "test_category"
        ? options.map(option => `<option value="${escapeAttr(option)}" ${option === testCategoryLabel(selected) ? "selected" : ""}>${escapeHtml(testCategoryLabel(option) || "请选择")}</option>`).join("")
        : optionHtml(options, selected || "");
      return `<select data-field="${escapeAttr(field)}" ${roleCanEdit() ? "" : "disabled"}>${html}</select>`;
    }

    function fieldBlock(label, control, extraClass = "") {
      return `<label class="field-label ${extraClass}"><span>${escapeHtml(label)}</span>${control}</label>`;
    }

    function kv(label, value) {
      return `<div class="kv-item"><span>${escapeHtml(label)}</span><b>${escapeHtml(compactText(value))}</b></div>`;
    }

    function editableKv(label, field, value, placeholder = "", type = "text") {
      return `<div class="kv-item"><label>${escapeHtml(label)}</label>${fieldInput(field, value, placeholder, type)}</div>`;
    }

    function normalizeCampaignYear(value) {
      const raw = String(value || "").trim();
      const fourDigit = raw.match(/^(20(?:26|27))(?:\D|$)/);
      if (fourDigit) return fourDigit[1];
      const shortYear = raw.match(/^(?:FY\s*)?(26|27)(?:\D|$)/i);
      return shortYear ? `20${shortYear[1]}` : "";
    }

    function effectiveCampaignYear(row = {}) {
      return normalizeCampaignYear(row.campaign_year || row.campaignYear || row.launchYear || row.launchDate) || CAMPAIGN_YEARS[0];
    }

    function canonicalCampaignName(year, name) {
      const selectedYear = normalizeCampaignYear(year) || CAMPAIGN_YEARS[0];
      const value = String(name || "").trim();
      if (selectedYear === "2027" && ["01月｜CNY", "01月｜CNY（含烘焙 / 三明治换新）"].includes(value)) {
        return "01月｜CNY（含烘焙 / 三明治换新）";
      }
      return value.replace(/^(\d{1,2})月[：:｜]/, (_, month) => `${month.padStart(2, "0")}月｜`);
    }

    function oraMonth(value) {
      const raw = String(value || "").trim();
      const match = raw.match(/^(\d{1,2})月/) || raw.match(/^(\d{2})\d{2}\b/);
      const month = Number(match?.[1]);
      return month >= 1 && month <= 12 ? `${String(month).padStart(2, "0")}月` : "";
    }

    function recordCampaignName(row = {}) {
      return testCategoryBrand(row.test_category) === "ora"
        ? oraMonth(row.campaign)
        : canonicalCampaignName(effectiveCampaignYear(row), row.campaign);
    }

    function recordPeriodValue(row = {}) {
      return testCategoryBrand(row.test_category) === "ora" ? oraMonth(row.campaign) : String(row.campaign || "");
    }

    function testCategoryLabel(value) {
      const category = String(value || "").trim();
      return ["Ora档期测试", "Ora月度测试", "Ora新品提案", "Ora新品测试"].includes(category) ? "Ora新品测试" : category;
    }

    function isOraNewTest(value) {
      return testCategoryLabel(value) === "Ora新品测试";
    }

    function projectNameForRecord(row, allRecords = records) {
      const key = effectiveProductGroupKey(row, allRecords);
      const latestAssignment = allRecords.filter(candidate => isOraNewTest(candidate.test_category) && effectiveProductGroupKey(candidate, allRecords) === key && Object.hasOwn(candidate, "project_name"))
        .sort((a, b) => groupingUpdateTime(b) - groupingUpdateTime(a))[0];
      return String(latestAssignment?.project_name || "").trim();
    }

    function projectPickerField(row) {
      const project = projectNameForRecord(row);
      const names = [...new Set(records.filter(item => isOraNewTest(item.test_category)).map(item => String(item.project_name || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, "zh-CN"));
      return `<label class="field-label" data-pm-project ${isOraNewTest(row.test_category) ? "" : "hidden"}>
        <span>项目名称</span>
        <input data-field="project_name" list="oraProjectNames" value="${escapeAttr(project)}" placeholder="由产品经理填写或选择项目名称" ${roleCanEdit() ? "" : "disabled"}>
        <datalist id="oraProjectNames">${names.map(name => `<option value="${escapeAttr(name)}"></option>`).join("")}</datalist>
      </label>`;
    }

    function campaignOptions(year) {
      const selectedYear = normalizeCampaignYear(year) || CAMPAIGN_YEARS[0];
      return [...(CAMPAIGN_OPTIONS_BY_YEAR[selectedYear] || [])];
    }

    function campaignOptionButtons(year, current = "", query = "") {
      const normalizedQuery = String(query || "").trim().toLowerCase();
      const options = campaignOptions(year).filter(option => !normalizedQuery || option.toLowerCase().includes(normalizedQuery));
      if (!options.length) return `<p class="campaign-options-empty">没有匹配档期，可直接输入；不会加入公共档期。</p>`;
      return options.map(option => `
        <button class="${option === current ? "active" : ""}" data-campaign-option="${escapeAttr(option)}" type="button">${escapeHtml(option)}</button>
      `).join("");
    }

    function campaignPickerField(row = {}) {
      const year = effectiveCampaignYear(row);
      const campaign = recordCampaignName(row);
      const isOra = testCategoryBrand(row.test_category) === "ora";
      if (isOra) return `
        <div class="field-label" data-pm-campaign data-period-brand="ora" ${!isOraNewTest(row.test_category) && (testCategoryKind(row.test_category) === "campaign" || row.campaign) ? "" : "hidden"}>
          <span>年份 / 月份</span>
          <div class="campaign-picker">
            <select data-field="campaign_year" data-campaign-year aria-label="年份" ${roleCanEdit() ? "" : "disabled"}>
              ${CAMPAIGN_YEARS.map(option => `<option value="${option}" ${option === year ? "selected" : ""}>${option} 年</option>`).join("")}
            </select>
            <select data-field="campaign" aria-label="月份" ${roleCanEdit() ? "" : "disabled"}>
              <option value="">请选择月份</option>
              ${Array.from({ length: 12 }, (_, index) => `${String(index + 1).padStart(2, "0")}月`).map(option => `<option value="${option}" ${option === campaign ? "selected" : ""}>${option}</option>`).join("")}
            </select>
          </div>
        </div>
      `;
      return `
        <div class="field-label" data-period-brand="peets" data-pm-campaign ${!isOraNewTest(row.test_category) && (testCategoryKind(row.test_category) === "campaign" || row.campaign) ? "" : "hidden"}>
          <span>档期年份 / 名称</span>
          <div class="campaign-picker">
            <select data-field="campaign_year" data-campaign-year ${roleCanEdit() ? "" : "disabled"}>
              ${CAMPAIGN_YEARS.map(option => `<option value="${option}" ${option === year ? "selected" : ""}>${option} 年</option>`).join("")}
            </select>
            <div class="campaign-combobox" data-campaign-combobox>
              <input data-field="campaign" value="${escapeAttr(campaign)}" placeholder="输入或选择档期名称" autocomplete="off" ${roleCanEdit() ? "" : "disabled"}>
              <button class="campaign-options-toggle" data-toggle-campaign-options type="button" aria-label="展开档期列表" aria-expanded="false" ${roleCanEdit() ? "" : "disabled"}>▾</button>
              <div class="campaign-options hidden" data-campaign-options>${campaignOptionButtons(year, campaign)}</div>
            </div>
          </div>
          <small data-campaign-legacy-note ${campaign && !campaignOptions(year).includes(campaign) ? "" : "hidden"}>原记录为历史档期名称，请对照 PMO 核对。</small>
        </div>
      `;
    }

    function campaignPickerNodes() {
      const combobox = appPanel.querySelector("[data-campaign-combobox]");
      return {
        combobox,
        input: combobox?.querySelector('[data-field="campaign"]') || null,
        year: appPanel.querySelector("[data-campaign-year]"),
        options: combobox?.querySelector("[data-campaign-options]") || null,
        toggle: combobox?.querySelector("[data-toggle-campaign-options]") || null
      };
    }

    function setCampaignOptionsOpen(open) {
      const { options, toggle } = campaignPickerNodes();
      if (!options || !toggle) return;
      options.classList.toggle("hidden", !open);
      toggle.setAttribute("aria-expanded", String(open));
    }

    function refreshCampaignOptions({ open = true, filter = false } = {}) {
      const { input, year, options } = campaignPickerNodes();
      if (!input || !year || !options) return;
      options.innerHTML = campaignOptionButtons(year.value, input.value.trim(), filter ? input.value : "");
      setCampaignOptionsOpen(open);
    }

    function closeCampaignOptions() {
      setCampaignOptionsOpen(false);
    }

    function normalizeGroupingText(value) {
      return String(value || "")
        .normalize("NFKC")
        .toLowerCase()
        .replace(/[\s\p{P}\p{S}]+/gu, "");
    }

    function automaticProductKey(row = {}) {
      const brand = testCategoryBrand(row.test_category);
      return `${brand === "legacy" ? "" : `${brand}::`}${normalizeGroupingText(row.supplier_name)}::${normalizeGroupingText(row.product_name)}`;
    }

    function groupingTime(row = {}) {
      const value = new Date(row.created_at || 0).getTime();
      return Number.isNaN(value) ? 0 : value;
    }

    function groupingUpdateTime(row = {}) {
      const value = new Date(row.updated_at || row.created_at || 0).getTime();
      return Number.isNaN(value) ? 0 : value;
    }

    function groupingVersionNumber(row = {}) {
      const match = String(row.version_label || "").trim().match(/^v\s*(\d+)$/i);
      return match ? Number(match[1]) : NaN;
    }

    function compareVersions(a = {}, b = {}) {
      const aVersion = groupingVersionNumber(a);
      const bVersion = groupingVersionNumber(b);
      const aKnown = Number.isFinite(aVersion);
      const bKnown = Number.isFinite(bVersion);
      if (aKnown !== bKnown) return aKnown ? -1 : 1;
      if (aKnown && aVersion !== bVersion) return aVersion - bVersion;
      const timeDifference = groupingTime(a) - groupingTime(b);
      if (timeDifference) return timeDifference;
      return String(a.id || "").localeCompare(String(b.id || ""));
    }

    function manualGroupAliases(allRecords = []) {
      const aliases = new Map();
      (allRecords || []).forEach(row => {
        const groupId = String(row.product_group_id || "").trim();
        if (!groupId) return;
        const supplier = normalizeGroupingText(row.supplier_name);
        const name = normalizeGroupingText(row.product_name);
        if (!supplier || !name) return;
        const brand = testCategoryBrand(row.test_category);
        const entry = aliases.get(groupId) || { supplier, brand, names: new Set() };
        if (entry.supplier === supplier && entry.brand === brand) entry.names.add(name);
        aliases.set(groupId, entry);
      });
      return aliases;
    }

    function effectiveProductGroupKey(row = {}, allRecords = []) {
      const groupId = String(row.product_group_id || "").trim();
      const brand = testCategoryBrand(row.test_category);
      const manualKey = id => `manual:${id}${brand === "legacy" ? "" : `::${brand}`}`;
      if (groupId) return manualKey(groupId);
      const supplier = normalizeGroupingText(row.supplier_name);
      const name = normalizeGroupingText(row.product_name);
      if (supplier && name) {
        const matchingManualGroups = [];
        manualGroupAliases(allRecords).forEach((entry, id) => {
          if (entry.supplier === supplier && entry.brand === testCategoryBrand(row.test_category) && entry.names.has(name)) matchingManualGroups.push(id);
        });
        if (matchingManualGroups.length === 1) return manualKey(matchingManualGroups[0]);
      }
      return `auto:${automaticProductKey(row)}`;
    }

    function buildProductGroups(allRecords = [], matchingRecords = allRecords, identityRecords = allRecords) {
      const matchingIds = new Set((matchingRecords || []).map(row => row.id));
      const groups = new Map();
      (allRecords || []).forEach(row => {
        const key = effectiveProductGroupKey(row, identityRecords);
        const group = groups.get(key) || { key, records: [], matchingIds: new Set() };
        group.records.push(row);
        if (matchingIds.has(row.id)) group.matchingIds.add(row.id);
        groups.set(key, group);
      });
      return Array.from(groups.values())
        .filter(group => group.matchingIds.size > 0)
        .map(group => {
          group.records.sort(compareVersions);
          group.latest = [...group.records].sort((a, b) => groupingTime(b) - groupingTime(a))[0] || {};
          group.supplier = group.latest.supplier_name || group.records[0]?.supplier_name || "";
          group.name = group.latest.product_name || group.records[0]?.product_name || "";
          group.productGroupId = group.key.startsWith("manual:") ? group.key.slice(7).replace(/::(?:peets|ora)$/, "") : "";
          group.pendingCount = group.records.filter(row => row.status !== "已确认").length;
          group.confirmedCount = group.records.filter(row => row.status === "已确认").length;
          return group;
        });
    }

    function buildVisibleProductGroups(allRecords = [], tabRecords = allRecords, matchingRecords = tabRecords) {
      return buildProductGroups(tabRecords, matchingRecords, allRecords);
    }

    function groupingBigrams(value) {
      const text = normalizeGroupingText(value);
      if (text.length < 2) return new Set(text ? [text] : []);
      const result = new Set();
      for (let index = 0; index < text.length - 1; index += 1) result.add(text.slice(index, index + 2));
      return result;
    }

    function productSimilarity(a, b) {
      const left = normalizeGroupingText(a);
      const right = normalizeGroupingText(b);
      if (!left || !right || left === right) return { score: left && left === right ? 1 : 0, isCandidate: false, reason: "" };
      const shorter = left.length <= right.length ? left : right;
      const longer = left.length > right.length ? left : right;
      const contains = shorter.length >= 4 && longer.includes(shorter);
      const leftBigrams = groupingBigrams(left);
      const rightBigrams = groupingBigrams(right);
      let intersection = 0;
      leftBigrams.forEach(token => { if (rightBigrams.has(token)) intersection += 1; });
      const dice = leftBigrams.size + rightBigrams.size
        ? (2 * intersection) / (leftBigrams.size + rightBigrams.size)
        : 0;
      const score = contains ? Math.max(0.9, dice) : dice;
      return {
        score,
        isCandidate: contains || dice >= 0.68,
        reason: contains ? "名称包含" : dice >= 0.68 ? "名称相似" : ""
      };
    }

    function suggestProductGroups(sourceGroup, groups = []) {
      if (!sourceGroup) return [];
      const sourceSupplier = normalizeGroupingText(sourceGroup.supplier);
      const sourceNames = [...new Set(sourceGroup.records.map(row => row.product_name).filter(Boolean))];
      return (groups || [])
        .filter(group => group.key !== sourceGroup.key && normalizeGroupingText(group.supplier) === sourceSupplier && testCategoryBrand(group.latest?.test_category) === testCategoryBrand(sourceGroup.latest?.test_category))
        .map(group => {
          const targetNames = [...new Set(group.records.map(row => row.product_name).filter(Boolean))];
          let best = { score: 0, isCandidate: false, reason: "" };
          sourceNames.forEach(source => targetNames.forEach(target => {
            const similarity = productSimilarity(source, target);
            if (similarity.score > best.score) best = similarity;
          }));
          return { group, ...best };
        })
        .filter(item => item.isCandidate)
        .sort((a, b) => b.score - a.score || groupingTime(b.group.latest) - groupingTime(a.group.latest))
        .slice(0, 3);
    }

    function recordVersionNumber(row = {}) {
      const match = String(row.version_label || "").trim().match(/^v\s*(\d+)$/i);
      return match ? Number(match[1]) : NaN;
    }

    function recordSequenceTime(row = {}) {
      const value = new Date(row.created_at || 0).getTime();
      return Number.isNaN(value) ? 0 : value;
    }

    function compareRecordSequence(a = {}, b = {}) {
      const aVersion = recordVersionNumber(a);
      const bVersion = recordVersionNumber(b);
      if (Number.isFinite(aVersion) && Number.isFinite(bVersion) && aVersion !== bVersion) return aVersion - bVersion;
      const timeDifference = recordSequenceTime(a) - recordSequenceTime(b);
      if (timeDifference) return timeDifference;
      return String(a.id || "").localeCompare(String(b.id || ""));
    }

    function deriveVersionStage(row = {}, allRecords = []) {
      const milestoneStages = {
        "通过且储备": "储备版",
        "通过且进入众测": "众测版",
        "通过且进入中试": "中试版",
        "通过且进入大生产": "大生产版"
      };
      if (milestoneStages[row.round_conclusion]) return milestoneStages[row.round_conclusion];

      const optimizationRules = {
        "众测后优化": { conclusion: "通过且进入众测", stage: "众测优化版" },
        "中试后优化": { conclusion: "通过且进入中试", stage: "中试优化版" },
        "上市后优化": { conclusion: "通过且进入大生产", stage: "大生产优化版" }
      };
      const rule = optimizationRules[row.tasting_scene];
      const identity = effectiveProductGroupKey(row, allRecords);
      if (!rule || identity === "auto:::") return "";
      const hasPriorMilestone = (allRecords || []).some(candidate =>
        candidate.id !== row.id &&
        effectiveProductGroupKey(candidate, allRecords) === identity &&
        compareRecordSequence(candidate, row) < 0 &&
        candidate.round_conclusion === rule.conclusion
      );
      return hasPriorMilestone ? rule.stage : "";
    }

    function createdTime(row) {
      const time = new Date(row.created_at || 0).getTime();
      return Number.isNaN(time) ? 0 : time;
    }

    function optionRank(options, value) {
      const index = options.indexOf(String(value || "").trim());
      return index >= 0 ? index : options.length + 1;
    }

    function compareSubmittedDesc(a, b) {
      return createdTime(b) - createdTime(a);
    }

    function defaultSortModeForStatus(filter = statusFilter) {
      return filter === "已确认" ? "workflow" : "recent";
    }

    function compareGroupIdentity(a, b) {
      return optionRank(PRODUCT_TYPE_ORDER, latestGroupValue(a, "product_type")) - optionRank(PRODUCT_TYPE_ORDER, latestGroupValue(b, "product_type")) ||
        String(a.name || "").localeCompare(String(b.name || ""), "zh-CN") ||
        String(a.supplier || "").localeCompare(String(b.supplier || ""), "zh-CN") ||
        groupingTime(b.latest) - groupingTime(a.latest);
    }

    function campaignGroupIdentity(value = {}) {
      const row = campaignRecord(value);
      const campaign = recordCampaignName(row);
      return campaign ? `${effectiveCampaignYear(row)}::${campaign}` : "";
    }

    function compareWorkflowGroups(a, b) {
      const categoryOrder = TEST_CATEGORY_DEFINITIONS.map(item => item.key);
      const aCategory = testCategorySectionKey(a);
      const bCategory = testCategorySectionKey(b);
      const categoryDifference = optionRank(categoryOrder, aCategory) - optionRank(categoryOrder, bCategory);
      if (categoryDifference) return categoryDifference;
      if (TEST_CATEGORY_DEFINITIONS.find(item => item.key === aCategory)?.kind === "campaign") {
        const aCampaign = campaignGroupIdentity(a);
        const bCampaign = campaignGroupIdentity(b);
        if (aCampaign !== bCampaign) {
          if (!aCampaign || !bCampaign) return aCampaign ? -1 : 1;
          const campaignDifference = compareCampaignLaunchOrder(a, b);
          if (campaignDifference) return campaignDifference;
        }
      }
      return compareGroupIdentity(a, b);
    }

    function sortRecords(rows) {
      return [...rows].sort(compareSubmittedDesc);
    }

    function recordMatchesStatusFilter(row, filter = statusFilter) {
      return !filter || row.status === filter;
    }

    function visibleRecords() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = records.filter(row => {
        const haystack = [
          row.product_name,
          row.supplier_name,
          row.version_label,
          deriveVersionStage(row, records),
          row.product_type,
          testCategoryLabel(row.test_category),
          projectNameForRecord(row),
          row.maintenance_purpose,
          row.campaign_year,
          row.campaign,
          row.version_change,
          row.finished_spec,
          row.length_mm,
          row.width_mm,
          row.height_mm,
          row.ingredients_structure,
          row.core_ingredients_selling_points,
          row.tasting_feedback,
          row.next_step_direction,
          row.key_blocker
        ].join(" ").toLowerCase();
        return recordMatchesStatusFilter(row) && (!q || haystack.includes(q));
      });
      return sortRecords(filtered);
    }

    function submissionBatchKey(row) {
      const explicit = String(row.submission_batch_id || "").trim();
      return explicit ? `batch:${explicit}` : `record:${row.id}`;
    }

    function validBatchItemIndex(row) {
      if (row.batch_item_index === null || row.batch_item_index === undefined || row.batch_item_index === "") return null;
      const value = Number(row.batch_item_index);
      return Number.isInteger(value) && value >= 0 ? value : null;
    }

    function comparePendingBatchItems(a, b) {
      const aIndex = validBatchItemIndex(a);
      const bIndex = validBatchItemIndex(b);
      if (aIndex !== null && bIndex !== null && aIndex !== bIndex) return aIndex - bIndex;
      const timeDifference = new Date(a.created_at || 0) - new Date(b.created_at || 0);
      return timeDifference || String(a.id || "").localeCompare(String(b.id || ""), "zh-CN");
    }

    function pendingSubmissionBatches() {
      const byKey = new Map();
      visibleRecords().filter(row => row.status === "待处理").forEach(row => {
        const key = submissionBatchKey(row);
        if (!byKey.has(key)) byKey.set(key, []);
        byKey.get(key).push(row);
      });
      return [...byKey.entries()]
        .map(([key, rows]) => {
          const orderedRecords = [...rows].sort(comparePendingBatchItems);
          const first = orderedRecords[0] || {};
          const submittedAt = orderedRecords.reduce((earliest, row) => {
            const value = new Date(row.created_at || 0).getTime();
            return Number.isFinite(value) ? Math.min(earliest, value) : earliest;
          }, Number.POSITIVE_INFINITY);
          return {
            key,
            supplier: first.supplier_name || "未知供应商",
            submittedAt: Number.isFinite(submittedAt) ? submittedAt : 0,
            records: orderedRecords
          };
        })
        .sort((a, b) => b.submittedAt - a.submittedAt || a.key.localeCompare(b.key, "zh-CN"));
    }

    function pendingSupplierGroups() {
      const bySupplier = new Map();
      pendingSubmissionBatches().forEach(batch => {
        const normalized = normalizeGroupingText(batch.supplier);
        const key = normalized && batch.supplier !== "未知供应商" ? normalized : batch.key;
        if (!bySupplier.has(key)) {
          bySupplier.set(key, { key, supplier: batch.supplier, batches: [], latestAt: 0, productCount: 0 });
        }
        const group = bySupplier.get(key);
        group.batches.push(batch);
        group.latestAt = Math.max(group.latestAt, batch.submittedAt);
        group.productCount += batch.records.length;
      });
      return [...bySupplier.values()]
        .sort((a, b) => b.latestAt - a.latestAt || a.supplier.localeCompare(b.supplier, "zh-CN"));
    }

    function pendingBatchesInDisplayOrder() {
      return pendingSupplierGroups().flatMap(group => group.batches);
    }

    function pendingRecordsInDisplayOrder() {
      return pendingBatchesInDisplayOrder().flatMap(batch => batch.records);
    }

    function nextPendingRecordId(currentId) {
      const batches = pendingBatchesInDisplayOrder();
      const batchIndex = batches.findIndex(batch => batch.records.some(row => row.id === currentId));
      if (batchIndex < 0) return pendingRecordsInDisplayOrder().find(row => row.id !== currentId)?.id || "";
      const batch = batches[batchIndex];
      const rowIndex = batch.records.findIndex(row => row.id === currentId);
      const sameBatch = [...batch.records.slice(rowIndex + 1), ...batch.records.slice(0, rowIndex)].find(row => row.id !== currentId);
      if (sameBatch) return sameBatch.id;
      return [...batches.slice(batchIndex + 1), ...batches.slice(0, batchIndex)]
        .flatMap(item => item.records)
        .find(row => row.id !== currentId)?.id || "";
    }

    function latestGroupValue(group, field) {
      return [...(group.records || [])]
        .sort((a, b) => groupingUpdateTime(b) - groupingUpdateTime(a))
        .find(row => String(row[field] || "").trim())?.[field] || "";
    }

    function visibleProductGroups() {
      const matchingRecords = visibleRecords();
      const tabRecords = records.filter(row => recordMatchesStatusFilter(row));
      const groups = buildVisibleProductGroups(records, tabRecords, matchingRecords);
      if (sortMode === "workflow") return groups.sort(compareWorkflowGroups);
      return groups.sort((a, b) => groupingTime(b.latest) - groupingTime(a.latest));
    }

    function testCategoryBrand(value) {
      const category = String(value || "").trim();
      if (category.startsWith("Peet's")) return "peets";
      if (category.startsWith("Ora")) return "ora";
      return "legacy";
    }

    function testCategoryKind(value) {
      const category = testCategoryLabel(value);
      if (isOraNewTest(category)) return "project";
      return TEST_CATEGORY_KINDS.find(item => category === item.label || category === `Peet's${item.label}` || category === `Ora${item.label}`)?.key || "uncategorized";
    }

    function testCategoryOptions(current) {
      current = testCategoryLabel(current);
      return ["", ...TEST_CATEGORY_OPTIONS, ...(current && !TEST_CATEGORY_OPTIONS.includes(current) ? [current] : [])];
    }

    function updatePmIntentFields() {
      const row = activeRecord() || {};
      const category = detailValue("test_category", row.test_category);
      const kind = testCategoryKind(category);
      let campaign = appPanel.querySelector("[data-pm-campaign]");
      const periodBrand = testCategoryBrand(category) === "ora" ? "ora" : "peets";
      if (campaign && campaign.dataset.periodBrand !== periodBrand) {
        const draft = { ...row, test_category: category, campaign_year: detailValue("campaign_year", effectiveCampaignYear(row)), campaign: detailValue("campaign", row.campaign || "") };
        campaign.outerHTML = campaignPickerField(draft);
        campaign = appPanel.querySelector("[data-pm-campaign]");
      }
      const purpose = appPanel.querySelector("[data-pm-maintenance]");
      if (campaign) campaign.hidden = kind === "project" || (kind !== "campaign" && !detailValue("campaign", row.campaign || ""));
      const project = appPanel.querySelector("[data-pm-project]");
      if (project) project.hidden = kind !== "project";
      if (purpose) purpose.hidden = kind !== "maintenance" && !detailValue("maintenance_purpose", row.maintenance_purpose || "");
      const year = detailValue("campaign_year", effectiveCampaignYear(row));
      const name = detailValue("campaign", row.campaign || "").trim();
      const note = appPanel.querySelector("[data-campaign-legacy-note]");
      if (note) note.hidden = !name || campaignOptions(year).includes(name);
    }

    function testCategorySectionKey(group) {
      const category = testCategoryLabel(latestGroupValue(group, "test_category"));
      const branded = TEST_CATEGORY_DEFINITIONS.find(item => item.label === category);
      return branded?.key || testCategoryKind(category);
    }

    function isPausedProductGroup(group, filter = statusFilter) {
      return filter === "已确认" && String(group.latest?.round_conclusion || "").trim() === "暂停";
    }

    function campaignRecord(value = {}) {
      if (!Array.isArray(value.records)) return value;
      return [...value.records]
        .sort((a, b) => groupingUpdateTime(b) - groupingUpdateTime(a))
        .find(row => String(row.campaign || "").trim()) || value.latest || {};
    }

    function campaignLaunchTimestamp(value = {}) {
      const row = campaignRecord(value);
      const campaign = String(row.campaign || "").trim();
      const standardMatch = campaign.match(/^(\d{2})月/);
      const legacyMatch = campaign.match(/^(\d{2})(\d{2})\b/);
      const oldLabelMatch = campaign.match(/^(\d{1,2})月[：:]/);
      const month = Number(standardMatch?.[1] || legacyMatch?.[1] || oldLabelMatch?.[1]);
      const year = Number(effectiveCampaignYear(row));
      if (!Number.isInteger(year) || month < 1 || month > 12) return NaN;
      return Date.UTC(year, month - 1, 1);
    }

    function compareCampaignLaunchOrder(a, b, now = new Date()) {
      const aTime = campaignLaunchTimestamp(a);
      const bTime = campaignLaunchTimestamp(b);
      const aValid = Number.isFinite(aTime);
      const bValid = Number.isFinite(bTime);
      if (aValid !== bValid) return aValid ? -1 : 1;
      if (aValid && bValid) {
        const currentMonth = Date.UTC(now.getFullYear(), now.getMonth(), 1);
        const aCurrentOrUpcoming = aTime >= currentMonth;
        const bCurrentOrUpcoming = bTime >= currentMonth;
        if (aCurrentOrUpcoming !== bCurrentOrUpcoming) return aCurrentOrUpcoming ? -1 : 1;
        if (aTime !== bTime) return aCurrentOrUpcoming ? aTime - bTime : bTime - aTime;
      }
      const aLatest = a.latest || a;
      const bLatest = b.latest || b;
      return groupingTime(bLatest) - groupingTime(aLatest);
    }

    function buildTestCategorySections(groups = [], filter = statusFilter) {
      const definitions = TEST_CATEGORY_DEFINITIONS;
      const buckets = new Map(definitions.map(definition => [definition.key, []]));
      groups.forEach(group => buckets.get(testCategorySectionKey(group)).push(group));
      return definitions
        .map(definition => {
          const sectionGroups = [...buckets.get(definition.key)];
          return {
            ...definition,
            brand: definition.key.startsWith("peets-") ? "peets" : definition.key.startsWith("ora-") ? "ora" : "legacy",
            label: testCategoryLabel(definition.label),
            note: definition.kind === "project" ? "项目 → 品类 → 产品 → 版本" : definition.kind === "campaign" && filter === "已确认"
              ? definition.key === "ora-campaign" ? "年月 → 类型 → 产品 → 版本" : "档期 → 类型 → 产品 → 版本"
              : definition.kind === "proposal"
                ? "类型 → 供应商 → 产品 → 版本"
                : "类型 → 产品 → 版本",
            groups: sectionGroups
          };
        })
        .filter(section => section.groups.length > 0);
    }

    function recordById(id) {
      return records.find(row => row.id === id) || null;
    }

    function activeRecord() {
      return recordById(activeRecordId);
    }

    function activeProductGroup() {
      return buildProductGroups(records, records).find(group => group.records.some(row => row.id === activeRecordId)) || null;
    }

    function activeVisibleProductGroup() {
      return visibleProductGroups().find(group => group.records.some(row => row.id === activeRecordId)) || null;
    }

    function visibleProductSections() {
      if (sortMode === "recent") {
        const groups = visibleProductGroups();
        return BRAND_DEFINITIONS.map(brand => ({
          key: `${brand.key}-recent`, brand: brand.key, label: "", note: "",
          groups: groups.filter(group => testCategoryBrand(latestGroupValue(group, "test_category")) === brand.key)
        })).filter(section => section.groups.length);
      }
      return buildTestCategorySections(visibleProductGroups());
    }

    function visibleProductGroupsInDisplayOrder() {
      return visibleProductSections().flatMap(section => {
        if (sortMode !== "workflow") return section.groups;
        if (section.kind === "project") {
          return projectGroupSections(section.groups).flatMap(project => productTypeGroupsInDisplayOrder(project.groups));
        }
        if (section.kind === "campaign") {
          return campaignGroupSections(section.groups).flatMap(campaignSection =>
            productTypeGroupsInDisplayOrder(campaignSection.groups)
          );
        }
        if (section.kind === "proposal") return proposalProductGroupsInDisplayOrder(section.groups);
        return productTypeGroupsInDisplayOrder(section.groups);
      });
    }

    function productTypeGroupsInDisplayOrder(groups = []) {
      return productTypeSections(groups).flatMap(typeSection => {
        const regularGroups = typeSection.groups.filter(group => !isPausedProductGroup(group));
        const pausedGroups = typeSection.groups.filter(group => isPausedProductGroup(group));
        const pausedDisplayOrder = supplierGroupSections(pausedGroups).flatMap(supplierSection => supplierSection.groups);
        return [...regularGroups, ...pausedDisplayOrder];
      });
    }

    function proposalProductGroupsInDisplayOrder(groups = []) {
      return productTypeSections(groups).flatMap(typeSection =>
        supplierGroupSections(typeSection.groups, { pausedLast: true })
          .flatMap(supplierSection => supplierSection.groups)
      );
    }

    function syncUrl() {
      const url = new URL(location.href);
      url.searchParams.delete("id");
      history.replaceState(history.state, "", `${url.pathname}${url.search}${url.hash}`);
    }

    function ensureActive(preferredId = activeRecordId) {
      if (statusFilter === "待处理") {
        const availableRows = pendingRecordsInDisplayOrder();
        activeRecordId = preferredId && availableRows.some(row => row.id === preferredId)
          ? preferredId
          : (availableRows[0]?.id || "");
        syncUrl();
        return;
      }
      const groups = visibleProductGroupsInDisplayOrder();
      const availableRows = groups.flatMap(group => group.records);
      if (preferredId && availableRows.some(row => row.id === preferredId)) {
        activeRecordId = preferredId;
      } else {
        const matchingRows = visibleRecords();
        const preferredRows = searchInput.value.trim() ? matchingRows : availableRows;
        activeRecordId = preferredRows[0]?.id || availableRows[0]?.id || matchingRows[0]?.id || "";
      }
      syncUrl();
    }

    function productGroupExpanded(key, activeKey, expandedKeys = expandedProductGroupKeys, collapsedKeys = collapsedProductGroupKeys) {
      return expandedKeys.has(key) || (key === activeKey && !collapsedKeys.has(key));
    }

    function setProductGroupExpanded(key, shouldExpand, expandedKeys = expandedProductGroupKeys, collapsedKeys = collapsedProductGroupKeys) {
      if (shouldExpand) {
        collapsedKeys.delete(key);
        expandedKeys.add(key);
      } else {
        expandedKeys.delete(key);
        collapsedKeys.add(key);
      }
    }

    function shouldShowProcessingStatus(filter = statusFilter) {
      return !filter;
    }

    function renderCounts() {
      const pending = records.filter(row => row.status === "待处理").length;
      const confirmed = records.filter(row => row.status === "已确认").length;
      countEls.pending.textContent = pending;
      countEls.confirmed.textContent = confirmed;
      countEls.all.textContent = records.length;
      document.querySelectorAll("[data-status-filter]").forEach(button => {
        button.classList.toggle("active", !crowdView && button.dataset.statusFilter === statusFilter);
      });
    }

    function buildCrowdSections(allRecords = [], query = "") {
      const years = new Map();
      const needle = query.trim().toLocaleLowerCase();
      for (const row of allRecords) {
        if (row.round_conclusion !== "通过且进入众测" && row.tasting_scene !== "众测后优化") continue;
        const rawYear = String(row.campaign_year || row.campaignYear || row.launchYear || "").trim();
        const year = rawYear.match(/20\d{2}/)?.[0] || normalizeCampaignYear(rawYear) || "";
        const campaign = recordCampaignName(row);
        if (!years.has(year)) years.set(year, new Map());
        const campaigns = years.get(year);
        if (!campaigns.has(campaign)) campaigns.set(campaign, new Map());
        const products = campaigns.get(campaign);
        const key = JSON.stringify([year, campaign, effectiveProductGroupKey(row, allRecords)]);
        if (!products.has(key)) products.set(key, { key, versions: [] });
        products.get(key).versions.push(row);
      }
      return [...years].sort(([a], [b]) => b.localeCompare(a)).map(([year, campaigns]) => ({
        year,
        campaigns: [...campaigns].sort(([a], [b]) => a && b ? a.localeCompare(b, 'zh-CN', { numeric: true }) : a ? -1 : 1).map(([name, groups]) => ({
          name,
          products: [...groups.values()].map(group => {
            group.versions.sort((a, b) => compareRecordSequence(b, a));
            return { ...group, latest: group.versions[0] };
          }).filter(group => !needle || group.versions.some(row => `${row.product_name} ${row.supplier_name}`.toLocaleLowerCase().includes(needle)))
            .sort((a, b) => String(a.latest.product_name || '').localeCompare(String(b.latest.product_name || ''), 'zh-CN'))
        })).filter(campaign => campaign.products.length)
      })).filter(year => year.campaigns.length);
    }

    function buildCrowdProjectSections(allRecords = [], query = "") {
      const groups = new Map();
      const needle = query.trim().toLocaleLowerCase();
      for (const row of allRecords) {
        if (row.round_conclusion !== "通过且进入众测" && row.tasting_scene !== "众测后优化") continue;
        const key = effectiveProductGroupKey(row, allRecords);
        if (!groups.has(key)) groups.set(key, { key, versions: [] });
        groups.get(key).versions.push(row);
      }
      const projects = new Map();
      for (const group of groups.values()) {
        group.versions.sort((a, b) => compareRecordSequence(b, a));
        group.latest = group.versions[0];
        const name = projectNameForRecord(group.latest, allRecords);
        if (needle && !`${name} ${group.versions.map(row => `${row.product_name} ${row.supplier_name}`).join(' ')}`.toLocaleLowerCase().includes(needle)) continue;
        if (!projects.has(name)) projects.set(name, []);
        projects.get(name).push(group);
      }
      return [...projects].sort(([a], [b]) => a && b ? a.localeCompare(b, 'zh-CN') : a ? -1 : 1)
        .map(([name, products]) => ({ name, project: true, products: products.sort((a, b) => String(a.latest.product_name || '').localeCompare(String(b.latest.product_name || ''), 'zh-CN')) }));
    }

    function crowdPrice(row) {
      const raw = row.quote_rmb;
      const value = Number(raw);
      return raw == null || String(raw).trim() === "" || !Number.isFinite(value) || value < 0
        ? '<span class="crowd-unquoted">待报价</span>'
        : `¥${value.toFixed(2)}`;
    }

    function crowdProductRow(row, group, history = false) {
      const stage = row.tasting_scene === "众测后优化" ? "众测后优化" : "众测版";
      const expanded = expandedCrowdProducts.has(group.key);
      const toggle = !history && group.versions.length > 1
        ? `<button type="button" class="crowd-toggle" data-crowd-toggle="${escapeAttr(group.key)}" aria-expanded="${expanded}" aria-label="${escapeAttr(row.product_name)}：${expanded ? '收起' : '展开'}旧版本">${expanded ? '收起旧版本 ▴' : `查看 ${group.versions.length - 1} 个旧版本 ▾`}</button>` : '';
      return `<tr class="${history ? 'crowd-history' : ''}" data-crowd-${history ? 'history' : 'latest'}="${escapeAttr(row.id)}">
        <td><button class="crowd-product-link" type="button" data-crowd-open="${escapeAttr(row.id)}">${history ? '↳ ' : ''}${escapeHtml(row.product_name || '未命名产品')}</button>${toggle}</td>
        <td>${escapeHtml(row.supplier_name || '供应商待补充')}</td>
        <td><span class="crowd-version">${escapeHtml(row.version_label || '版本待补充')} · ${stage}</span></td>
        <td class="crowd-price">${crowdPrice(row)}</td>
      </tr>`;
    }

    function crowdTypeSections(groups) {
      const types = new Map();
      groups.forEach(group => {
        const type = String(group.latest.product_type || "").trim() || "品类待补充";
        if (!types.has(type)) types.set(type, []);
        types.get(type).push(group);
      });
      return [...types].map(([type, products]) => ({ type, products }))
        .sort((a, b) => optionRank(PRODUCT_TYPE_ORDER, a.type) - optionRank(PRODUCT_TYPE_ORDER, b.type) || a.type.localeCompare(b.type, "zh-CN"));
    }

    function crowdPeriodHtml(brand, year, campaign) {
      const periodName = campaign.name || (campaign.project ? "项目待补充" : brand.key === "ora" ? "月份待补充" : "档期待补充");
      return `<details class="crowd-campaign" ${campaign.project ? `data-crowd-project="${escapeAttr(periodName)}"` : ""} open><summary>${escapeHtml(periodName)}<span>${campaign.products.length} 个产品</span></summary>
        ${crowdTypeSections(campaign.products).map(typeSection => {
          const key = JSON.stringify([brand.key, campaign.project ? "project" : "campaign", year, campaign.name, typeSection.type]);
          const expanded = !collapsedCrowdTypes.has(key);
          return `<section class="crowd-type" data-crowd-type="${escapeAttr(typeSection.type)}">
            <button class="crowd-type-bar product-type-bar" type="button" data-crowd-type-toggle="${escapeAttr(key)}" aria-expanded="${expanded}">
              <strong class="crowd-type-title">${escapeHtml(typeSection.type)}</strong>
              <span class="product-type-meta"><span>${typeSection.products.length} 个产品</span><span class="product-type-caret" aria-hidden="true">▼</span></span>
            </button>
            <div data-crowd-type-body ${expanded ? "" : "hidden"}>
              <table class="crowd-table" aria-label="${escapeAttr(`${brand.label} ${campaign.project ? '' : year || '年份待补充'} ${periodName} ${typeSection.type}`)}">
                <thead><tr><th scope="col">产品名称</th><th scope="col">供应商</th><th scope="col">版本 / 阶段</th><th scope="col">报价（元）</th></tr></thead>
                ${typeSection.products.map(group => `<tbody>${crowdProductRow(group.latest, group)}${expandedCrowdProducts.has(group.key) ? group.versions.slice(1).map(row => crowdProductRow(row, group, true)).join('') : ''}</tbody>`).join('')}
              </table>
            </div>
          </section>`;
        }).join('')}
      </details>`;
    }

    function renderCrowdProducts() {
      const pane = document.querySelector('#crowdProductsPane');
      const brands = BRAND_DEFINITIONS.map(brand => {
        const brandRecords = records.filter(row => testCategoryBrand(row.test_category) === brand.key);
        return { ...brand,
          projects: buildCrowdProjectSections(brandRecords.filter(row => isOraNewTest(row.test_category)), crowdSearch),
          years: buildCrowdSections(brandRecords.filter(row => !isOraNewTest(row.test_category)), crowdSearch)
        };
      }).filter(brand => brand.projects.length || brand.years.length);
      const brandCount = brand => brand.projects.reduce((sum, project) => sum + project.products.length, 0) + brand.years.reduce((sum, year) => sum + year.campaigns.reduce((n, campaign) => n + campaign.products.length, 0), 0);
      const total = brands.reduce((sum, brand) => sum + brandCount(brand), 0);
      pane.innerHTML = `<div class="crowd-inner"><div class="crowd-heading"><div><h2>众测产品信息</h2><p>按品牌、项目 / 档期、品类查找 · 报价对应产品版本，含税含运</p></div><span class="crowd-total">${total} 个产品 · 默认显示最新众测相关版本</span></div>${brands.length ? brands.map(brand => `
        <section class="crowd-brand brand-${brand.key}" data-crowd-brand="${brand.key}">
          <header class="crowd-brand-bar"><h3 class="crowd-brand-title">${escapeHtml(brand.label)}</h3><span>${brandCount(brand)} 个产品</span></header>
          ${brand.projects.length ? `<h4 class="crowd-year-title">新品测试</h4>${brand.projects.map(project => crowdPeriodHtml(brand, '', project)).join('')}` : ''}
          ${brand.years.map(section => `<section data-crowd-year="${escapeAttr(section.year)}">
            <h4 class="crowd-year-title">${section.year ? `${escapeHtml(section.year)} 年` : '年份待补充'}</h4>
            ${section.campaigns.map(campaign => crowdPeriodHtml(brand, section.year, campaign)).join('')}
          </section>`).join('')}
        </section>`).join('')
        : `<div class="crowd-empty"><p>${crowdSearch ? '没有匹配的众测产品。' : '暂无进入众测或众测后优化的产品。'}</p><button type="button" data-crowd-empty-action>${crowdSearch ? '清空搜索' : '刷新数据'}</button></div>`}</div>`;
    }

    function setCrowdView(visible) {
      if (crowdView !== visible) {
        if (visible) { inboxSearch = searchInput.value; searchInput.value = crowdSearch; }
        else { crowdSearch = searchInput.value; searchInput.value = inboxSearch; }
      }
      crowdView = visible;
      document.querySelector('.workspace').classList.toggle('hidden', visible);
      document.querySelector('#crowdProductsPane').classList.toggle('hidden', !visible);
      document.querySelector('#crowdProductsTab').classList.toggle('active', visible);
      document.querySelector('#crowdProductsTab').setAttribute('aria-pressed', String(visible));
      document.querySelector('.sort-control').classList.toggle('hidden', visible);
      exportBtn.classList.toggle('hidden', visible);
      searchInput.placeholder = visible ? '搜索产品名称、供应商、项目' : '搜索供应商、产品、项目、摘要';
      renderCounts();
      if (visible) renderCrowdProducts();
    }

    function submissionNumber(row) {
      const group = buildProductGroups(records, records).find(item => item.records.some(candidate => candidate.id === row.id));
      return Math.max(1, (group?.records || []).findIndex(item => item.id === row.id) + 1);
    }

    function statusClass(row) {
      return row.status === "已确认" ? "confirmed" : "pending";
    }

    function versionStageBadge(stage) {
      return stage ? `<span class="version-stage-badge">${escapeHtml(stage)}</span>` : "";
    }

    function productGroupListHtml(group, sectionKey, activeGroupKey, showProcessingStatus) {
      const isActiveGroup = group.key === activeGroupKey;
      const isExpanded = productGroupExpanded(group.key, activeGroupKey);
      const isPaused = isPausedProductGroup(group);
      const statusParts = [
        group.pendingCount ? `${group.pendingCount} 待处理` : "",
        group.confirmedCount ? `${group.confirmedCount} 已确认` : ""
      ].filter(Boolean).join(" · ");
      const confirmedCampaign = statusFilter === "已确认" && sectionKey === "campaign" && sortMode !== "workflow";
      const groupCampaignRecord = campaignRecord(group);
      const campaignText = confirmedCampaign
        ? ` · 档期：${effectiveCampaignYear(groupCampaignRecord)} · ${compactText(groupCampaignRecord.campaign, "未选择")}`
        : "";
      return `
        <section class="product-group ${isActiveGroup ? "active" : ""} ${isExpanded ? "" : "collapsed"}" data-product-group-key="${escapeAttr(group.key)}">
          <button class="product-group-head" data-product-group-toggle="${escapeAttr(group.key)}" type="button" aria-expanded="${isExpanded}">
            <span class="product-group-title-row">
              <span class="product-group-title">${escapeHtml(compactText(group.name, "未命名产品"))}</span>
              <span class="product-group-title-actions">
                ${isPaused ? `<span class="product-paused-badge" data-product-paused>已暂停</span>` : ""}
                <span class="product-group-caret">▼</span>
              </span>
            </span>
            <span class="product-group-meta-row">
              <span>${escapeHtml(compactText(group.supplier, "未知供应商"))} · ${group.records.length} 个版本 · ${escapeHtml(relativeTime(group.latest.created_at))}${escapeHtml(campaignText)}</span>
              ${showProcessingStatus && statusParts ? `<span class="product-group-status">处理状态：${escapeHtml(statusParts)}</span>` : ""}
            </span>
          </button>
          <div class="product-version-list">
            ${group.records.map(row => {
              const stage = deriveVersionStage(row, records);
              const matchesFilter = group.matchingIds.has(row.id);
              return `
                <button class="version-item ${row.id === activeRecordId ? "active" : ""} ${matchesFilter ? "" : "filter-muted"}" data-record-id="${escapeAttr(row.id)}" type="button">
                  <span class="version-item-head">
                    <span class="version-item-version">${escapeHtml(compactText(row.version_label, "未填版本"))}${stage ? versionStageBadge(stage) : ""}</span>
                    <span class="item-time">${escapeHtml(relativeTime(row.created_at))}</span>
                  </span>
                  <span class="version-item-meta">
                    ${showProcessingStatus ? `<span class="status-word ${statusClass(row)}">处理状态：${escapeHtml(row.status || "待处理")}</span>` : ""}
                    <span>${escapeHtml(compactText(row.product_type || row.test_category, "未分类"))}</span>
                  </span>
                  <span class="version-item-summary">${escapeHtml(compactText(row.version_change || row.core_ingredients_selling_points || row.ingredients_structure, "暂无摘要"))}</span>
                </button>
              `;
            }).join("")}
          </div>
        </section>
      `;
    }

    function productTypeSections(groups = []) {
      const buckets = new Map();
      groups.forEach(group => {
        const type = String(latestGroupValue(group, "product_type") || "未分类").trim();
        if (!buckets.has(type)) buckets.set(type, []);
        buckets.get(type).push(group);
      });
      return [...buckets.entries()]
        .map(([type, typeGroups]) => ({
          type,
          groups: typeGroups.sort(compareGroupIdentity)
        }))
        .sort((a, b) =>
          optionRank(PRODUCT_TYPE_ORDER, a.type) - optionRank(PRODUCT_TYPE_ORDER, b.type) ||
          a.type.localeCompare(b.type, "zh-CN")
        );
    }

    function campaignGroupSections(groups = []) {
      const buckets = new Map();
      groups.forEach(group => {
        const row = campaignRecord(group);
        const campaign = recordCampaignName(row);
        const year = campaign ? effectiveCampaignYear(row) : "";
        const key = campaign ? `${year}::${campaign}` : "unassigned";
        const bucket = buckets.get(key) || { key, year, campaign, groups: [] };
        bucket.groups.push(group);
        buckets.set(key, bucket);
      });
      return [...buckets.values()].sort((a, b) => {
        if (!a.campaign || !b.campaign) return a.campaign ? -1 : b.campaign ? 1 : 0;
        return compareCampaignLaunchOrder(a.groups[0], b.groups[0]);
      });
    }

    function supplierGroupSections(groups = [], { pausedLast = false } = {}) {
      const buckets = new Map();
      groups.forEach(group => {
        const supplier = String(group.supplier || "").trim() || "未知供应商";
        const key = normalizeGroupingText(supplier) || "unknown";
        const bucket = buckets.get(key) || { key, supplier, groups: [], latestTime: 0 };
        bucket.groups.push(group);
        bucket.latestTime = Math.max(bucket.latestTime, groupingTime(group.latest));
        buckets.set(key, bucket);
      });
      return [...buckets.values()]
        .map(bucket => ({
          ...bucket,
          groups: bucket.groups.sort((a, b) => {
            if (pausedLast) {
              const pausedDifference = Number(isPausedProductGroup(a)) - Number(isPausedProductGroup(b));
              if (pausedDifference) return pausedDifference;
            }
            return groupingTime(b.latest) - groupingTime(a.latest) || compareGroupIdentity(a, b);
          })
        }))
        .sort((a, b) =>
          b.latestTime - a.latestTime || a.supplier.localeCompare(b.supplier, "zh-CN")
        );
    }

    function pausedSupplierSectionsHtml(groups, sectionKey, activeGroupKey, showProcessingStatus, scopeKey = sectionKey) {
      const supplierSections = supplierGroupSections(groups);
      const activeSupplierKey = supplierSections.find(supplierSection =>
        supplierSection.groups.some(group => group.key === activeGroupKey)
      );
      return supplierSections.map(supplierSection => {
        const recordCount = supplierSection.groups.reduce((total, group) => total + group.records.length, 0);
        const supplierToggleKey = `${scopeKey}:${supplierSection.key}`;
        const isExpanded = productGroupExpanded(
          supplierToggleKey,
          activeSupplierKey ? `${scopeKey}:${activeSupplierKey.key}` : "",
          expandedSupplierGroupKeys,
          collapsedSupplierGroupKeys
        );
        return `
          <div class="supplier-group-section" data-supplier-group-section="${escapeAttr(supplierToggleKey)}">
            <button class="supplier-group-bar" data-supplier-group-toggle="${escapeAttr(supplierToggleKey)}" type="button" aria-expanded="${isExpanded}">
              <strong>${escapeHtml(supplierSection.supplier)}</strong>
              <span class="supplier-group-meta">
                <span>${supplierSection.groups.length} 个产品 · ${recordCount} 条记录</span>
                <span class="supplier-group-caret" aria-hidden="true">▼</span>
              </span>
            </button>
            <div class="supplier-group-body" data-supplier-group-body="${escapeAttr(supplierToggleKey)}" ${isExpanded ? "" : "hidden"}>
              ${supplierSection.groups.map(group => productGroupListHtml(group, sectionKey, activeGroupKey, showProcessingStatus)).join("")}
            </div>
          </div>
        `;
      }).join("");
    }

    function proposalSupplierSectionsHtml(groups, sectionKey, activeGroupKey, showProcessingStatus, scopeKey = sectionKey) {
      const supplierSections = supplierGroupSections(groups, { pausedLast: true });
      const activeSupplierKey = supplierSections.find(supplierSection =>
        supplierSection.groups.some(group => group.key === activeGroupKey)
      );
      return supplierSections.map(supplierSection => {
        const recordCount = supplierSection.groups.reduce((total, group) => total + group.records.length, 0);
        const supplierToggleKey = `${scopeKey}:${supplierSection.key}`;
        const isExpanded = productGroupExpanded(
          supplierToggleKey,
          activeSupplierKey ? `${scopeKey}:${activeSupplierKey.key}` : "",
          expandedSupplierGroupKeys,
          collapsedSupplierGroupKeys
        );
        return `
          <div class="supplier-group-section" data-supplier-group-section="${escapeAttr(supplierToggleKey)}">
            <button class="supplier-group-bar proposal-supplier-group-bar" data-supplier-group-toggle="${escapeAttr(supplierToggleKey)}" type="button" aria-expanded="${isExpanded}">
              <strong>${escapeHtml(supplierSection.supplier)}</strong>
              <span class="supplier-group-meta">
                <span>${supplierSection.groups.length} 个产品 · ${recordCount} 条记录</span>
                <span class="supplier-group-caret" aria-hidden="true">▼</span>
              </span>
            </button>
            <div class="supplier-group-body" data-supplier-group-body="${escapeAttr(supplierToggleKey)}" ${isExpanded ? "" : "hidden"}>
              ${supplierSection.groups.map(group => productGroupListHtml(group, sectionKey, activeGroupKey, showProcessingStatus)).join("")}
            </div>
          </div>
        `;
      }).join("");
    }

    function productTypeSectionsHtml(groups, sectionKey, activeGroupKey, showProcessingStatus, scopeKey = sectionKey, { collapsible = true } = {}) {
      return productTypeSections(groups).map(typeSection => {
        const regularGroups = typeSection.groups.filter(group => !isPausedProductGroup(group));
        const pausedGroups = typeSection.groups.filter(group => isPausedProductGroup(group));
        const typeScopeKey = `${scopeKey}:type:${normalizeGroupingText(typeSection.type) || "unknown"}`;
        const isExpanded = !collapsedProductTypeKeys.has(typeScopeKey);
        const typeBar = collapsible
          ? `<button class="product-type-bar" data-product-type-group data-product-type-toggle="${escapeAttr(typeScopeKey)}" type="button" aria-expanded="${isExpanded}">
              <strong>${escapeHtml(typeSection.type)}</strong>
              <span class="product-type-meta"><span>${typeSection.groups.length} 个产品</span><span class="product-type-caret" aria-hidden="true">▼</span></span>
            </button>`
          : `<header class="product-type-bar" data-product-type-group><strong>${escapeHtml(typeSection.type)}</strong><span>${typeSection.groups.length} 个产品</span></header>`;
        return `
          <div class="product-type-section" data-product-type-section="${escapeAttr(typeSection.type)}">
            ${typeBar}
            <div class="product-type-body" data-product-type-body="${escapeAttr(typeScopeKey)}" ${collapsible && !isExpanded ? "hidden" : ""}>
              ${regularGroups.map(group => productGroupListHtml(group, sectionKey, activeGroupKey, showProcessingStatus)).join("")}
              ${pausedSupplierSectionsHtml(pausedGroups, sectionKey, activeGroupKey, showProcessingStatus, typeScopeKey)}
            </div>
          </div>
        `;
      }).join("");
    }

    function proposalProductTypeSectionsHtml(groups, sectionKey, activeGroupKey, showProcessingStatus) {
      return productTypeSections(groups).map(typeSection => {
        const typeScopeKey = `${sectionKey}:type:${normalizeGroupingText(typeSection.type) || "unknown"}`;
        const isExpanded = !collapsedProductTypeKeys.has(typeScopeKey);
        return `
          <div class="product-type-section" data-product-type-section="${escapeAttr(typeSection.type)}">
            <button class="product-type-bar" data-product-type-group data-product-type-toggle="${escapeAttr(typeScopeKey)}" type="button" aria-expanded="${isExpanded}">
              <strong>${escapeHtml(typeSection.type)}</strong>
              <span class="product-type-meta"><span>${typeSection.groups.length} 个产品</span><span class="product-type-caret" aria-hidden="true">▼</span></span>
            </button>
            <div class="product-type-body" data-product-type-body="${escapeAttr(typeScopeKey)}" ${isExpanded ? "" : "hidden"}>
              ${proposalSupplierSectionsHtml(typeSection.groups, sectionKey, activeGroupKey, showProcessingStatus, typeScopeKey)}
            </div>
          </div>
        `;
      }).join("");
    }

    function workflowSectionHtml(section, activeGroupKey, showProcessingStatus) {
      if (section.kind === "project") return projectWorkflowHtml(section.groups, section, activeGroupKey, showProcessingStatus);
      const shouldGroupCampaigns = section.kind === "campaign" && statusFilter === "已确认";
      if (shouldGroupCampaigns) {
        return campaignWorkflowHtml(section.groups, section, activeGroupKey, showProcessingStatus);
      }
      if (section.kind === "proposal") {
        return proposalProductTypeSectionsHtml(section.groups, section.key, activeGroupKey, showProcessingStatus);
      }
      if (section.kind === "maintenance") {
        return productTypeSectionsHtml(section.groups, section.key, activeGroupKey, showProcessingStatus, section.key, { collapsible: true });
      }
      return productTypeSectionsHtml(section.groups, section.key, activeGroupKey, showProcessingStatus);
    }

    function projectGroupSections(groups) {
      const projects = new Map();
      groups.forEach(group => {
        const name = projectNameForRecord(group.latest);
        if (!projects.has(name)) projects.set(name, []);
        projects.get(name).push(group);
      });
      return [...projects].map(([name, groups]) => ({ name, key: JSON.stringify(["ora-project", name]), groups }))
        .sort((a, b) => a.name && b.name ? a.name.localeCompare(b.name, "zh-CN", { numeric: true }) : a.name ? -1 : b.name ? 1 : 0);
    }

    function projectWorkflowHtml(groups, section, activeGroupKey, showProcessingStatus) {
      return projectGroupSections(groups).map(project => {
        const expanded = !collapsedCampaignGroupKeys.has(project.key);
        const count = project.groups.reduce((sum, group) => sum + group.records.length, 0);
        return `<section class="campaign-group-section" data-project-group="${escapeAttr(project.name)}">
          <button class="campaign-group-bar project-group-bar" data-project-group-toggle="${escapeAttr(project.key)}" type="button" aria-expanded="${expanded}">
            <strong>${escapeHtml(project.name || "项目待补充")}</strong>
            <span class="campaign-group-meta"><span>${project.groups.length} 个产品 · ${count} 条记录</span><span class="campaign-group-caret" aria-hidden="true">▼</span></span>
          </button>
          <div data-project-group-body="${escapeAttr(project.key)}" ${expanded ? "" : "hidden"}>
            ${productTypeSectionsHtml(project.groups, section.key, activeGroupKey, showProcessingStatus, project.key)}
          </div>
        </section>`;
      }).join("");
    }

    function campaignWorkflowHtml(groups, section, activeGroupKey, showProcessingStatus) {
      const campaignSections = campaignGroupSections(groups);
      const activeCampaignKey = campaignSections.find(campaignSection =>
        campaignSection.groups.some(group => group.key === activeGroupKey)
      )?.key || "";
      return campaignSections.map(campaignSection => {
        const recordCount = campaignSection.groups.reduce((total, group) => total + group.records.length, 0);
        const label = campaignSection.campaign
          ? section.key === "ora-campaign" ? `${campaignSection.year} 年 ${campaignSection.campaign}` : `${campaignSection.year}｜${campaignSection.campaign}`
          : section.key === "ora-campaign" ? "待补充年月" : "待补充档期";
        const scopedKey = `${section.key}:${campaignSection.key}`;
        const isExpanded = productGroupExpanded(
          scopedKey,
          activeCampaignKey ? `${section.key}:${activeCampaignKey}` : "",
          expandedCampaignGroupKeys,
          collapsedCampaignGroupKeys
        );
        return `
          <div class="campaign-group-section" data-campaign-group-section="${escapeAttr(scopedKey)}">
            <button class="campaign-group-bar" data-campaign-group data-campaign-group-toggle="${escapeAttr(scopedKey)}" type="button" aria-expanded="${isExpanded}">
              <strong>${escapeHtml(label)}</strong>
              <span class="campaign-group-meta">
                <span>${campaignSection.groups.length} 个产品 · ${recordCount} 条记录</span>
                <span class="campaign-group-caret" aria-hidden="true">▼</span>
              </span>
            </button>
            <div class="campaign-group-body" data-campaign-group-body="${escapeAttr(scopedKey)}" ${isExpanded ? "" : "hidden"}>
              ${productTypeSectionsHtml(campaignSection.groups, section.key, activeGroupKey, showProcessingStatus, `${section.key}:${campaignSection.key}`)}
            </div>
          </div>
        `;
      }).join("");
    }

    function pendingSubmissionItemHtml(row) {
      return `
        <button class="pending-batch-item ${row.id === activeRecordId ? "active" : ""}" data-record-id="${escapeAttr(row.id)}" type="button">
          <span class="pending-batch-item-head">
            <span class="pending-batch-product-name">${escapeHtml(compactText(row.product_name, "未命名产品"))}</span>
          </span>
          <span class="pending-batch-item-meta">
            <span>${escapeHtml(compactText(row.version_label, "未填版本"))} · ${escapeHtml(compactText(row.product_type, "未分类"))} · ${escapeHtml(compactText(testCategoryLabel(row.test_category), "未分类"))}</span>
            <span>${escapeHtml(relativeTime(row.created_at))}</span>
          </span>
          <span class="pending-batch-item-summary">${escapeHtml(compactText(row.version_change || row.core_ingredients_selling_points || row.ingredients_structure, "暂无摘要"))}</span>
        </button>
      `;
    }

    function renderPendingSubmissionList() {
      const groups = pendingSupplierGroups();
      if (!groups.length) {
        listEl.innerHTML = `<div class="empty-list">暂无匹配记录。</div>`;
        return;
      }
      listEl.innerHTML = groups.map(group => {
        const supplierExpanded = !collapsedPendingSupplierKeys.has(group.key);
        return `
          <section class="pending-supplier-group" data-pending-supplier-key="${escapeAttr(group.key)}" aria-expanded="${supplierExpanded}">
            <button class="pending-supplier-head" data-pending-supplier-toggle="${escapeAttr(group.key)}" type="button" aria-expanded="${supplierExpanded}">
              <span class="pending-supplier-name">${escapeHtml(group.supplier)}</span>
              <span class="pending-supplier-meta">${group.productCount} 个产品 <span aria-hidden="true">${supplierExpanded ? "▼" : "▶"}</span></span>
            </button>
            <div class="pending-supplier-body">
              ${group.batches.flatMap(batch => batch.records).map(pendingSubmissionItemHtml).join("")}
            </div>
          </section>
        `;
      }).join("");
    }

    function renderList() {
      if (statusFilter === "待处理") {
        renderPendingSubmissionList();
        return;
      }
      const groups = visibleProductGroupsInDisplayOrder();
      if (!groups.length) {
        listEl.innerHTML = `<div class="empty-list">暂无匹配记录。</div>`;
        return;
      }
      const sections = visibleProductSections();
      const activeGroupKey = activeProductGroup()?.key || "";
      const showProcessingStatus = shouldShowProcessingStatus();
      const sectionHtml = section => {
        const recordCount = section.groups.reduce((total, group) => total + group.records.length, 0);
        const isCollapsed = collapsedTestCategoryKeys.has(section.key);
        const sectionBar = section.label ? `
          <button class="test-category-bar ${section.kind || section.key}-section" data-test-category-section="${escapeAttr(section.key)}" data-test-category-toggle="${escapeAttr(section.key)}" type="button" aria-expanded="${!isCollapsed}">
            <span class="test-category-title">${escapeHtml(section.label)}</span>
            <span class="test-category-meta">
              ${section.note ? `<span class="test-category-note">${escapeHtml(section.note)}</span>` : ""}
              <span>${section.groups.length} 个产品 · ${recordCount} 条记录</span>
              <span class="test-category-caret" aria-hidden="true">▼</span>
            </span>
          </button>
        ` : "";
        return `
          <section class="test-category-section ${section.key}-category-section">
            ${sectionBar}
            <div class="test-category-body" data-test-category-body="${escapeAttr(section.key)}" ${isCollapsed ? "hidden" : ""}>
              ${sortMode === "workflow"
                ? workflowSectionHtml(section, activeGroupKey, showProcessingStatus)
                : section.groups.map(group => productGroupListHtml(group, section.key, activeGroupKey, showProcessingStatus)).join("")}
            </div>
          </section>
        `;
      };
      listEl.innerHTML = BRAND_DEFINITIONS.map(brand => {
        const brandSections = sections.filter(section => section.brand === brand.key);
        if (!brandSections.length) return "";
        const productCount = brandSections.reduce((sum, section) => sum + section.groups.length, 0);
        return `<section class="inbox-brand brand-${brand.key}" data-inbox-brand="${brand.key}">
          <header class="inbox-brand-bar"><h2 class="inbox-brand-title">${escapeHtml(brand.label)}</h2><span>${productCount} 个产品</span></header>
          ${brandSections.map(sectionHtml).join("")}
        </section>`;
      }).join("");
    }

    function renderVersionSwitcher(row) {
      const group = activeVisibleProductGroup();
      if (!group || group.records.length < 2) return "";
      return `
        <nav class="version-switcher" aria-label="切换产品版本">
          ${group.records.map(candidate => {
            const stage = deriveVersionStage(candidate, records);
            return `
              <button class="version-switch-button ${candidate.id === row.id ? "active" : ""}" data-version-record-id="${escapeAttr(candidate.id)}" type="button">
                <span>${escapeHtml(compactText(candidate.version_label, "未填版本"))}</span>
                ${stage ? versionStageBadge(stage) : ""}
              </button>
            `;
          }).join("")}
        </nav>
      `;
    }

    function allProductGroups() {
      return buildProductGroups(records, records).sort((a, b) => groupingTime(b.latest) - groupingTime(a.latest));
    }

    function productGroupByKey(key) {
      return allProductGroups().find(group => group.key === key) || null;
    }

    function groupingTargetHtml(item, suggested = false) {
      const group = item.group || item;
      const reason = item.reason || "";
      return `
        <button class="grouping-target" data-merge-product-group-key="${escapeAttr(group.key)}" type="button">
          <span class="grouping-target-copy">
            <b>${escapeHtml(compactText(group.name, "未命名产品"))}</b>
            <span>${escapeHtml(compactText(group.supplier, "未知供应商"))} · ${group.records.length} 个版本 · ${group.records.map(row => row.version_label || "未填版本").join(" / ")}</span>
          </span>
          ${suggested ? `<span class="grouping-reason">${escapeHtml(reason || "名称相似")}</span>` : ""}
        </button>
      `;
    }

    function renderProductGroupingCandidates() {
      const source = productGroupByKey(groupingSourceKey);
      if (!source) {
        productGroupCandidates.innerHTML = `<p class="grouping-empty">当前产品组已发生变化，请关闭后重试。</p>`;
        return;
      }
      const allGroups = allProductGroups();
      const suggestions = suggestProductGroups(source, allGroups);
      const suggestedKeys = new Set(suggestions.map(item => item.group.key));
      const query = normalizeGroupingText(productGroupSearch.value);
      const sameSupplier = allGroups.filter(group =>
        group.key !== source.key &&
        normalizeGroupingText(group.supplier) === normalizeGroupingText(source.supplier) &&
        testCategoryBrand(group.latest?.test_category) === testCategoryBrand(source.latest?.test_category) &&
        (!query || normalizeGroupingText(`${group.name} ${group.records.map(row => row.product_name).join(" ")}`).includes(query))
      );
      const otherGroups = sameSupplier.filter(group => !suggestedKeys.has(group.key));
      productGroupCandidates.innerHTML = `
        <section class="grouping-section">
          <h3>可能属于同一产品</h3>
          <div class="grouping-target-list">
            ${suggestions.length ? suggestions.map(item => groupingTargetHtml(item, true)).join("") : `<p class="grouping-empty">暂未识别到相似名称，可在下方搜索同一供应商的其他产品。</p>`}
          </div>
        </section>
        <section class="grouping-section">
          <h3>同一供应商的其他产品</h3>
          <div class="grouping-target-list">
            ${otherGroups.length ? otherGroups.map(group => groupingTargetHtml(group)).join("") : `<p class="grouping-empty">没有其他匹配产品组。</p>`}
          </div>
        </section>
      `;
      const detachButton = productGroupModal.querySelector("[data-detach-current-version]");
      const restoreButton = productGroupModal.querySelector("[data-restore-auto-grouping]");
      detachButton.disabled = source.records.length < 2;
      restoreButton.disabled = !source.records.some(row => String(row.product_group_id || "").trim());
    }

    function openProductGroupingModal() {
      const source = activeProductGroup();
      if (!source) return;
      groupingSourceKey = source.key;
      productGroupCurrent.textContent = `${compactText(source.name, "未命名产品")} · ${compactText(source.supplier, "未知供应商")} · ${source.records.length} 个版本`;
      productGroupSearch.value = "";
      renderProductGroupingCandidates();
      productGroupModal.classList.remove("hidden");
      productGroupSearch.focus();
    }

    function closeProductGroupingModal() {
      productGroupModal.classList.add("hidden");
      groupingSourceKey = "";
    }

    async function setProductGroup(recordIds, productGroupId) {
      if (!roleCanEdit()) throw new Error("当前账号没有修改权限。");
      if (!cloudbaseReady) throw new Error("产品归组目前仅支持腾讯云收件箱。");
      const data = await cloudbaseRequest("adminSetProductGroup", { recordIds, productGroupId });
      (data.records || []).forEach(updated => {
        const index = records.findIndex(row => row.id === updated.id);
        if (index >= 0) records[index] = updated;
      });
      return data.records || [];
    }

    async function mergeProductGroups(targetKey) {
      const source = productGroupByKey(groupingSourceKey);
      const target = productGroupByKey(targetKey);
      if (!source || !target) throw new Error("产品组已发生变化，请刷新后重试。");
      const confirmed = window.confirm(`确认将“${source.name}”的 ${source.records.length} 个版本归入“${target.name}”？\n各版本仍保留为独立记录。`);
      if (!confirmed) return;
      const productGroupId = target.productGroupId || source.productGroupId || `pg-${crypto.randomUUID()}`;
      const recordIds = [...new Set([...source.records, ...target.records].map(row => row.id))];
      await setProductGroup(recordIds, productGroupId);
      closeProductGroupingModal();
      renderAll(activeRecordId);
      showMessage("产品版本已归入同一产品组，各版本记录保持独立。", "success");
    }

    async function detachCurrentVersion() {
      const source = productGroupByKey(groupingSourceKey);
      const row = activeRecord();
      if (!source || !row || source.records.length < 2) return;
      const confirmed = window.confirm(`确认将 ${row.version_label || "当前版本"} 从“${source.name}”移出并建立独立产品组？`);
      if (!confirmed) return;
      await setProductGroup([row.id], `pg-${crypto.randomUUID()}`);
      closeProductGroupingModal();
      renderAll(row.id);
      showMessage("当前版本已移出并建立独立产品组。", "success");
    }

    async function restoreAutomaticGrouping() {
      const source = productGroupByKey(groupingSourceKey);
      if (!source || !source.records.some(row => String(row.product_group_id || "").trim())) return;
      const confirmed = window.confirm(`确认清除“${source.name}”的人工归组关系，并重新按供应商和品名自动归组？`);
      if (!confirmed) return;
      await setProductGroup(source.records.map(row => row.id), null);
      closeProductGroupingModal();
      renderAll(activeRecordId);
      showMessage("已恢复按供应商和品名自动归组。", "success");
    }

    function renderImageStrip(row) {
      const imgs = imageUrls(row);
      if (!imgs.length) return "";
      return `
        <div class="image-strip">
          ${imgs.map((url, index) => `
            <figure class="image-item">
              <button class="image-button ${index === 0 ? "main" : ""}" data-image-url="${escapeAttr(url)}" type="button">
                <img src="${escapeAttr(url)}" alt="产品照 ${index + 1}">
              </button>
              <figcaption class="image-label">图 ${index + 1}</figcaption>
            </figure>
          `).join("")}
        </div>
      `;
    }

    function sectionHtml(title, value, className = "") {
      const text = String(value || "").trim();
      if (!text) return "";
      return `<section class="section-block ${className}"><h3 class="section-title-bar">${escapeHtml(title)}</h3><p class="section-copy">${nl(text)}</p></section>`;
    }

    function structureSectionHtml(title, value) {
      const lines = String(value || "").split(/\r?\n/).map(line => line.trim()).filter(Boolean);
      if (!lines.length) return "";
      return `

      if (!draft || !selected.length) return;
      const available = Math.max(0, 6 - draft.items.length);
      if (selected.length > available) throw new Error(`每条记录最多保存 6 张图片，当前还能新增 ${available} 张。`);
      draft.items.push(...selected.map(newAdminImageItem));

    function replaceAdminImage(draftKey, file) {
      const draft = ensureAdminImageDraft();
      const index = draft?.items.findIndex(item => item.draftKey === draftKey) ?? -1;
      if (!draft || index < 0 || !file?.type?.startsWith("image/")) throw new Error("请选择有效的图片文件。");
      const current = draft.items[index];
      if (current.kind === "new" && current.previewUrl) URL.revokeObjectURL(current.previewUrl);
      draft.items.splice(index, 1, newAdminImageItem(file));
      refreshAdminImageEditor();
    }

    function removeAdminImage(draftKey) {
      const draft = ensureAdminImageDraft();
      const index = draft?.items.findIndex(item => item.draftKey === draftKey) ?? -1;
      if (!draft || index < 0) return;
      const [removed] = draft.items.splice(index, 1);
      if (removed.kind === "new" && removed.previewUrl) URL.revokeObjectURL(removed.previewUrl);
      refreshAdminImageEditor();
    }

          showMessage(error.message || "请重新登录。", "error");

    function comparableRecordValue(value) {
