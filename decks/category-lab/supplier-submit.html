<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3ea">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="产品信息提交">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/supplier-pwa-icon.svg">
  <link rel="icon" href="/assets/supplier-pwa-icon.svg" type="image/svg+xml">
  <title>产品信息提交</title>
  <style>
    :root {
      --paper: #f7f3ea;
      --panel: #fffdf8;
      --line: #d7c7ad;
      --ink: #1d1a16;
      --muted: #756b5d;
      --accent: #1f6f5b;
      --danger: #b23b28;
      --shadow: 0 16px 42px rgba(34, 28, 18, 0.12);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif;
      line-height: 1.55;
    }
    main {
      width: min(1040px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    .status-pill {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(255, 253, 248, 0.72);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    form { padding: 22px; }
    .section {
      padding: 20px 0;
      border-top: 1px solid #eadfce;
    }
    .section:first-child {
      padding-top: 0;
      border-top: 0;
    }
    .section-title {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 900;
    }
    .mode-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .mode-button[aria-pressed="true"] {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }
    .followup-summary {
      display: none;
      margin-top: 10px;
      border: 1px solid #eadfce;
      border-radius: 6px;
      background: #fff;
      padding: 10px 11px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    .hidden { display: none !important; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: 1 / -1; }
    label {
      display: block;
      margin-bottom: 6px;
      color: #3e352b;
      font-size: 13px;
      font-weight: 900;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 10px 11px;
      outline: none;
    }
    input[type="date"] {
      min-height: 45px;
      line-height: 1.4;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="date"]::-webkit-date-and-time-value {
      min-height: 24px;
      text-align: left;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      margin-left: auto;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #b18a47;
      box-shadow: 0 0 0 3px rgba(177, 138, 71, 0.16);
    }
    select { min-height: 45px; }
    textarea {
      min-height: 98px;
      resize: vertical;
    }
    .field-note {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
    }
    .product-list {
      display: grid;
      gap: 14px;
    }
    .product-card {
      border: 1px solid #eadfce;
      border-radius: 8px;
      background: #fffaf1;
      padding: 14px;
    }
    .product-card + .product-card {
      margin-top: 4px;
    }
    .product-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .product-title {
      margin: 0;
      font-size: 15px;
      font-weight: 900;
    }
    .product-card .section-title {
      margin-top: 14px;
      font-size: 14px;
    }
    .product-fields {
      display: grid;
      gap: 14px;
    }
    .grid.product-main {
      grid-template-columns: minmax(240px, 1.65fr) minmax(118px, 0.7fr) minmax(170px, 1fr);
    }
    .grid.product-main.cake {
      grid-template-columns: minmax(240px, 1.65fr) minmax(118px, 0.7fr) minmax(170px, 1fr) minmax(120px, 0.6fr);
    }
    .dimension-row {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .grid.two.product-notes,
    .grid.two.feedback-pair {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .structure-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }
    .structure-guidance {
      margin: 0 0 10px;
      border-left: 3px solid #b18a47;
      background: #f7f0e4;
      color: #574a39;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.6;
    }
    .weight-summary {
      margin-left: auto;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }
    .structure-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .structure-table th,
    .structure-table td {
      border: 1px solid #eadfce;
      padding: 8px;
      text-align: left;
      vertical-align: middle;
    }
    .structure-table th {
      background: #f2eadc;
      color: #3e352b;
      font-size: 12px;
    }
    .structure-table .weight-cell {
      width: 150px;
      text-align: center;
    }
    .structure-table .percent-cell {
      width: 86px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .structure-table .action-cell { width: 82px; }
    .structure-mobile-label { display: none; }
    @media (min-width: 521px) {
      .structure-table tbody :is(.weight-cell, .action-cell) { vertical-align: top; }
      .structure-table tbody :is(.weight-cell, .action-cell) .structure-mobile-label {
        display: block;
        visibility: hidden;
        margin-bottom: 5px;
        font-size: 11px;
        font-weight: 900;
        line-height: 1.55;
      }
      .structure-table tbody .action-cell .ghost-button { min-height: 44px; }
    }
    .structure-description-cell {
      display: grid;
      gap: 5px;
    }
    .structure-layer-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }
    .structure-error {
      min-height: 0;
      margin: 0;
      color: var(--danger);
      font-size: 11px;
      line-height: 1.45;
    }
    .structure-error:empty { display: none; }
    .structure-percent {
      color: var(--ink);
      font-weight: 900;
    }
    .ghost-button {
      min-height: 36px;
      padding: 7px 10px;
    }
    .ghost-button.danger {
      color: var(--danger);
    }
    .spec-compare {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
    }
    .spec-compare:empty {
      display: none;
    }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .preview-grid figure {
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }
    .preview-grid img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #f1eadf;
    }
    .preview-grid figcaption {
      padding: 7px 8px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 18px;
      border-top: 1px solid #eadfce;
    }
    button, .link-button {
      appearance: none;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-weight: 900;
      padding: 9px 14px;
      text-decoration: none;
    }
    button.primary {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }
    .message {
      display: none;
      margin: 0 22px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px 14px;
      background: #fff;
      color: var(--muted);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .message.show { display: block; }
    .message.error {
      border-color: rgba(178, 59, 40, 0.42);
      background: #fff8f6;
      color: var(--danger);
    }
    .message.success {
      border-color: rgba(31, 111, 91, 0.42);
      background: #f6fffb;
      color: var(--accent);
    }
    .submission-result {
      display: grid;
      gap: 10px;
    }
    .submission-result-title {
      margin: 0;
      color: inherit;
      font-weight: 900;
    }
    .submission-result-list {
      display: grid;
      gap: 8px;
    }
    .submission-result-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid rgba(31, 111, 91, 0.18);
      border-radius: 6px;
      background: #fff;
      padding: 10px 11px;
    }
    .submission-result-info {
      min-width: 0;
    }
    .submission-product-name {
      display: block;
      color: var(--ink);
      font-weight: 900;
      overflow-wrap: anywhere;
    }
    .submission-result-note {
      margin: 0;
      color: inherit;
      font-size: 13px;
      font-weight: 800;
    }
    .confirm-dialog {
      width: min(460px, calc(100vw - 36px));
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      padding: 0;
      box-shadow: var(--shadow);
    }
    .confirm-dialog::backdrop {
      background: rgba(29, 26, 22, 0.32);
    }
    .confirm-body {
      padding: 20px 20px 16px;
    }
    .confirm-title {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 900;
    }
    .confirm-copy {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 20px 18px;
      border-top: 1px solid #eadfce;
    }
    @media (max-width: 760px) {
      main {
        width: min(100vw - 22px, 1040px);
        padding-top: 18px;
      }
      header { display: block; }
      .status-pill {
        display: inline-block;
        margin-top: 12px;
      }
      form { padding: 16px; }
      .grid, .grid.two { grid-template-columns: 1fr; }
      .grid.product-main,
      .grid.product-main.cake,
      .dimension-row,
      .grid.two.product-notes,
      .grid.two.feedback-pair { grid-template-columns: 1fr; }
      .span-2, .span-3 { grid-column: auto; }
      .actions { justify-content: stretch; }
      button, .link-button { width: 100%; }
      .mode-switch { display: grid; }
      .structure-tools { align-items: stretch; }
      .weight-summary { width: 100%; margin-left: 0; }
      .structure-table { min-width: 560px; }
      .structure-builder { overflow-x: auto; }
      .confirm-actions { display: grid; }
    }
    @media (max-width: 520px) {
      main {
        width: 100%;
        padding: 12px 10px 22px;
      }
      h1 { font-size: 28px; }
      .eyebrow { font-size: 12px; }
      .panel {
        border-radius: 8px;
        box-shadow: 0 10px 28px rgba(34, 28, 18, 0.1);
      }
      form { padding: 12px; }
      .section { padding: 16px 0; }
      .product-card {
        padding: 12px;
        border-radius: 8px;
      }
      .product-card-header {
        align-items: stretch;
      }
      .product-card-header .ghost-button {
        width: auto;
        min-width: 86px;
      }
      input, select, textarea {
        min-height: 46px;
        font-size: 16px;
        padding: 10px;
      }
      textarea { min-height: 112px; }
      .structure-tools {
        display: grid;
        grid-template-columns: 1fr;
      }
      .structure-table {
        min-width: 0;
        table-layout: auto;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 13px;
      }
      .structure-table thead {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .structure-table tbody {
        display: grid;
        gap: 8px;
      }
      .structure-table tbody tr {
        display: grid;
        grid-template-columns: minmax(100px, 1fr) 40px 53px;
        gap: 8px 6px;
        padding: 10px;
        border: 1px solid #eadfce;
        border-radius: 8px;
        background: #fffdf8;
      }
      .structure-table tbody td {
        display: block;
        width: auto;
        padding: 0;
        border: 0;
      }
      .structure-table tbody td:first-child { grid-column: 1 / -1; }
      .structure-table .weight-cell { width: auto; text-align: left; }
      .structure-table .percent-cell,
      .structure-table .action-cell {
        width: auto;
        align-self: end;
      }
      .structure-mobile-label {
        display: block;
        min-height: 18px;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
        line-height: 1.4;
      }
      .structure-table .ghost-button {
        width: 100%;
        min-width: 0;
        min-height: 46px;
        padding: 7px 6px;
      }
      .structure-builder { overflow-x: visible; }
      .preview-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .mobile-sticky-actions {
        position: sticky;
        bottom: 0;
        z-index: 8;
        margin: 0 -12px -12px;
        padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
        background: rgba(255, 253, 248, 0.96);
        backdrop-filter: blur(10px);
      }
      .message {
        margin: 0 12px 14px;
      }
      .submission-result-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
      }
      .confirm-dialog {
        width: calc(100vw - 24px);
      }
      .confirm-body {
        padding: 18px 16px 14px;
      }
      .confirm-actions {
        padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Category Lab Supplier Form</p>
        <h1>产品信息提交</h1>
      </div>
    </header>

    <section class="panel">
      <form id="submissionForm">
        <div class="section">
          <p class="section-title">测试前资料</p>
          <div class="grid two">
            <div>
              <label for="supplierName">供应商 *</label>
              <input id="supplierName" name="supplierName" required autocomplete="organization" placeholder="供应商公司简称">
            </div>
            <div>
              <label for="sampleDate">送样时间 *</label>
              <input id="sampleDate" name="sampleDate" type="date" required>
            </div>
            <div>
              <label for="productType">产品类型 *</label>
              <select id="productType" name="productType" required>
                <option value="">请选择</option>
                <option value="烘焙">烘焙</option>
                <option value="蛋糕">蛋糕</option>
                <option value="三明治">三明治</option>
                <option value="预包装食品">预包装食品</option>
              </select>
            </div>
            <div>
              <label for="testCategory">测试类别 *</label>
              <select id="testCategory" name="testCategory" required>
                <option value="">请选择</option>
                <option value="Peet's档期测试">Peet's档期测试</option>
                <option value="Peet's新品提案">Peet's新品提案</option>
                <option value="Peet's老品维护">Peet's老品维护</option>
                <option value="Peet's特殊测试">Peet's特殊测试</option>
                <option value="Ora档期测试">Ora月度测试</option>
                <option value="Ora新品提案">Ora新品提案</option>
                <option value="Ora老品维护">Ora老品维护</option>
                <option value="Ora特殊测试">Ora特殊测试</option>
              </select>
            </div>
          </div>
        </div>

        <div class="section">
          <p class="section-title">产品信息</p>
          <div class="product-list" id="productsContainer"></div>
          <div class="structure-tools" style="margin-top:12px;">
            <button class="ghost-button" id="addProductBtn" type="button">新增产品</button>
          </div>
        </div>

        <div class="actions mobile-sticky-actions">
          <button class="primary" id="submitBtn" type="submit">提交</button>
        </div>
      </form>
      <div class="message" id="message"></div>
      <dialog class="confirm-dialog" id="confirmDialog" aria-labelledby="confirmTitle">
        <div class="confirm-body">
          <p class="confirm-title" id="confirmTitle">确认提交</p>
          <p class="confirm-copy" id="confirmCopy">请确认本次填写的信息真实、完整，并已完成提交前检查。提交后由 Category Lab 产品负责人接收，用于测试资料整理。</p>
        </div>
        <div class="confirm-actions">
          <button id="confirmCancelBtn" type="button">返回修改</button>
          <button class="primary" id="confirmSubmitBtn" type="button">确认提交</button>
        </div>
      </dialog>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script src="./cloudbase-config.js"></script>
  <script>
    const TABLE_BUCKET = window.CATEGORYLAB_SUPABASE?.bucket || "supplier-feedback-images";
    const config = window.CATEGORYLAB_SUPABASE || {};
    const cloudbaseConfig = window.CATEGORYLAB_CLOUDBASE || {};
    const form = document.querySelector("#submissionForm");
    const message = document.querySelector("#message");
    const submitBtn = document.querySelector("#submitBtn");
    const confirmDialog = document.querySelector("#confirmDialog");
    const confirmCopy = document.querySelector("#confirmCopy");
    const confirmCancelBtn = document.querySelector("#confirmCancelBtn");
    const confirmSubmitBtn = document.querySelector("#confirmSubmitBtn");
    const productsContainer = document.querySelector("#productsContainer");
    const addProductBtn = document.querySelector("#addProductBtn");
    const cloudbaseHost = /tcloudbase|cloudbase|tencent/i.test(location.hostname) || new URLSearchParams(location.search).get("backend") === "cloudbase";
    const cloudbaseReady = Boolean(cloudbaseConfig.apiUrl) && cloudbaseHost;
    const supabaseReady = Boolean(config.url && config.anonKey && window.supabase);
    const backendReady = cloudbaseReady || supabaseReady;
    const SUPPLIER_FORM_MAINTENANCE = false;
    const client = supabaseReady ? window.supabase.createClient(config.url, config.anonKey) : null;
    const PRODUCT_FIELD_NAMES = [
      "productName",
      "versionLabel",
      "finishedSpec",
      "lengthMm",
      "widthMm",
      "heightMm",
      "versionChange",
      "coreIngredientsSellingPoints"
    ];
    let products = [];

    function showMessage(text, type = "") {
      message.className = `message show ${type}`.trim();
      message.textContent = text;
    }

    function clearMessage() {
      message.className = "message";
      message.textContent = "";
    }

    function appendText(parent, tagName, text, className = "") {
      const node = document.createElement(tagName);
      if (className) node.className = className;
      node.textContent = text;
      parent.appendChild(node);
      return node;
    }

    function showCreateResult(results, warnings = []) {
      message.className = `message show ${warnings.length ? "error" : "success"}`.trim();
      message.textContent = "";

      const wrapper = document.createElement("div");
      wrapper.className = "submission-result";
      appendText(wrapper, "p", `已提交 ${results.length} 个产品，Category Lab 产品负责人会进行资料整理。`, "submission-result-title");

      const list = document.createElement("div");
      list.className = "submission-result-list";
      results.forEach((result, index) => {
        const row = document.createElement("div");
        row.className = "submission-result-row";

        const info = document.createElement("div");
        info.className = "submission-result-info";
        appendText(info, "span", `产品 ${index + 1}：${result.productName}`, "submission-product-name");
        row.appendChild(info);

        list.appendChild(row);
      });
      wrapper.appendChild(list);
      appendText(wrapper, "p", "提交后由 Category Lab 产品负责人进行整理，如需补充信息请直接沟通。", "submission-result-note");
      warnings.forEach(warning => appendText(wrapper, "p", warning, "submission-result-note"));
      message.appendChild(wrapper);
    }

    function escapeAttr(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function field(name) {
      return form.elements[name];
    }

    function setRequired(name, required) {
      if (field(name)) field(name).required = required;
    }

    function numeric(value) {
      const parsed = Number(String(value || "").replace(/[^0-9.]/g, ""));
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function formatWeight(value) {
      return Number(value || 0).toFixed(2).replace(/\.?0+$/, "");
    }

    async function cloudbaseRequest(action, payload = {}) {
      const response = await fetch(cloudbaseConfig.apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, ...payload })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || `请求失败（${response.status}）`);
      }
      return result.data;
    }

    function rowId() {
      return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
    }

    function newProduct() {
      return {
        id: rowId(),
        fields: {},
        structures: [{ id: rowId(), name: "", weight: "" }],
        files: []
      };
    }

    function productById(productId) {
      return products.find(product => product.id === productId);
    }

    function productCard(productId) {
      return productsContainer.querySelector(`[data-product-id="${CSS.escape(productId)}"]`);
    }

    function productValue(product, name) {
      return product.fields?.[name] || "";
    }

    function specWeight(product) {
      const match = String(productValue(product, "finishedSpec") || "").match(/(\d+(?:\.\d+)?)\s*g/i);
      return match ? Number(match[1]) : 0;
    }

    function structureTotal(product) {
      return (product.structures || []).reduce((sum, row) => sum + numeric(row.weight), 0);
    }

    function structureWeightRequiredForType(type) {
      return type === "烘焙" || type === "三明治";
    }

    function normalizeStructureDescription(value) {
      return String(value || "").normalize("NFKC").replace(/[^\p{Script=Han}A-Za-z0-9]/gu, "");
    }

    function structureDescriptionIsValid(value) {
      const normalized = String(value || "").normalize("NFKC");
      return normalized === normalizeStructureDescription(normalized);
    }

    function formatStructurePercent(weight, total) {
      if (!(weight > 0) || !(total > 0)) return "—";
      return `${Number(((weight / total) * 100).toFixed(1))}%`;
    }

    function structureLayerLabel(index) {
      return index === 0 ? "第1层｜最底层" : `第${index + 1}层`;
    }

    function structureText(product) {
      const filledRows = (product.structures || [])
        .map((row, index) => ({
          index,
          name: String(row.name || "").trim(),
          weight: numeric(row.weight)
        }))
        .filter(row => row.name || row.weight > 0);

      const total = filledRows.reduce((sum, row) => sum + row.weight, 0);

      const lines = filledRows.map(row => {
        const weightText = row.weight > 0 ? ` ${formatWeight(row.weight)}g` : "";
        const percentText = row.weight > 0 && total > 0 ? `（${formatStructurePercent(row.weight, total)}）` : "";
        return `${structureLayerLabel(row.index)}：${row.name}${weightText}${percentText}`.trim();
      });
      if (total > 0) lines.push(`自动计算总克重：${formatWeight(total)}g`);
      return lines.join("\n");
    }

    function dimensionFieldsForType(type) {
      if (type === "蛋糕") return ["heightMm"];
      if (type === "烘焙" || type === "三明治") return ["lengthMm", "widthMm", "heightMm"];
      return [];
    }

    function dimensionLabel(fieldName) {
      return {
        lengthMm: "长度（mm）",
        widthMm: "宽度（mm）",
        heightMm: "高度（mm）"
      }[fieldName] || fieldName;
    }

    function dimensionFieldsHtml(product) {
      const fields = dimensionFieldsForType(field("productType").value);
      if (!fields.length) return "";
      if (fields.length === 1) {
        const name = fields[0];
        return `
        <div>
          <label>${dimensionLabel(name)} *</label>
          <input data-product-field="${escapeAttr(name)}" data-product-required required inputmode="decimal" value="${escapeAttr(productValue(product, name))}" placeholder="填写数字">
        </div>
        `;
      }
      return `
        <div class="dimension-row">
        ${fields.map(name => `
        <div>
          <label>${dimensionLabel(name)} *</label>
          <input data-product-field="${escapeAttr(name)}" data-product-required required inputmode="decimal" value="${escapeAttr(productValue(product, name))}" placeholder="填写数字">
        </div>
      `).join("")}
        </div>
      `;
    }

    function selectHtml(name, options, selected) {
      const opts = options.map(option => `<option value="${escapeAttr(option)}" ${option === selected ? "selected" : ""}>${escapeAttr(option || "请选择")}</option>`).join("");
      return `<select data-product-field="${escapeAttr(name)}">${opts}</select>`;
    }

    function syncModeFieldState() {
      productsContainer.querySelectorAll("input, select, textarea, button").forEach(control => {
        if (control.id === "addProductBtn") return;
        if (control.matches("[data-delete-product]") && products.length <= 1) {
          control.disabled = true;
          return;
        }
        control.disabled = control.matches("[data-delete-product]") && products.length <= 1;
      });
      productsContainer.querySelectorAll("[data-product-required]").forEach(control => {
        control.required = true;
      });
    }

    function focusAndExplain(input, messageText) {
      if (input) {
        input.focus();
        if (input.setCustomValidity) {
          input.setCustomValidity(messageText);
          input.reportValidity();
          input.setCustomValidity("");
        }
      }
      throw new Error(messageText);
    }

    function requiredProductValue(card, fieldName, label, index) {
      const input = card.querySelector(`[data-product-field="${fieldName}"]`);
      if (!input || String(input.value || "").trim()) return;
      focusAndExplain(input, `请填写产品 ${index + 1} 的${label}。`);
    }

    function requiredProductStructure(card, index) {
      const rows = [...card.querySelectorAll("[data-structure-id]")];
      const inputs = rows.map(row => row.querySelector('[data-structure-field="name"]'));
      const hasStructure = inputs.some(input => String(input?.value || "").trim());
      if (!hasStructure) focusAndExplain(inputs[0], `请填写产品 ${index + 1} 的产品结构。`);
      const invalidInput = inputs.find(input => !structureDescriptionIsValid(input?.value || ""));
      if (invalidInput) {
        focusAndExplain(invalidInput, "每一行只能填写一层。请点击“向上新增一层”继续填写。");
      }

      if (!structureWeightRequiredForType(field("productType").value)) return;
      const missingWeightRow = rows.find(row => !String(row.querySelector('[data-structure-field="weight"]')?.value || "").trim());
      if (!missingWeightRow) return;
      focusAndExplain(
        missingWeightRow.querySelector('[data-structure-field="weight"]'),
        `请填写产品 ${index + 1} 的产品结构重量。`
      );
    }

    function requiredProductImages(product, card, index) {
      if ((product.files || []).length > 0) return;
      const input = card.querySelector("[data-product-images]");
      focusAndExplain(input, `请上传产品 ${index + 1} 的产品照。`);
    }

    function validateProducts() {
      for (const [index, product] of products.entries()) {
        const card = productCard(product.id);
        if (!card) continue;
        requiredProductValue(card, "productName", "品名", index);
        requiredProductValue(card, "versionLabel", "版本", index);
        requiredProductValue(card, "finishedSpec", "产品规格（g）", index);
        dimensionFieldsForType(field("productType").value).forEach(name => {
          requiredProductValue(card, name, dimensionLabel(name), index);
        });
        requiredProductValue(card, "versionChange", "本版调整点", index);
        requiredProductValue(card, "coreIngredientsSellingPoints", "核心原料及卖点", index);
        requiredProductStructure(card, index);
        requiredProductImages(product, card, index);
      }
    }

    function confirmSubmission() {
      const copy = "请确认本次填写的产品资料真实、完整，并已完成提交前检查。提交后由 Category Lab 产品负责人接收，用于测试资料整理。";
      if (confirmCopy) confirmCopy.textContent = copy;
      if (!confirmDialog?.showModal) {
        return Promise.resolve(window.confirm(`确认提交\n\n${copy}`));
      }
      return new Promise(resolve => {
        const cleanup = () => {
          confirmCancelBtn.removeEventListener("click", onCancel);
          confirmSubmitBtn.removeEventListener("click", onSubmit);
          confirmDialog.removeEventListener("cancel", onCancel);
        };
        const close = value => {
          cleanup();
          if (confirmDialog.open) confirmDialog.close();
          resolve(value);
        };
        const onCancel = event => {
          event.preventDefault();
          close(false);
        };
        const onSubmit = () => close(true);
        confirmCancelBtn.addEventListener("click", onCancel);
        confirmSubmitBtn.addEventListener("click", onSubmit);
        confirmDialog.addEventListener("cancel", onCancel);
        confirmDialog.showModal();
      });
    }

    function productStructureRows(product) {
      const weightRequired = structureWeightRequiredForType(field("productType").value);
      const total = structureTotal(product);
      return (product.structures || []).map((row, index) => `
        <tr data-structure-id="${escapeAttr(row.id)}">
          <td>
            <div class="structure-description-cell">
              <span class="structure-layer-label" data-structure-layer-label>${escapeAttr(structureLayerLabel(index))}</span>
              <input data-structure-field="name" value="${escapeAttr(row.name || "")}" autocomplete="off" placeholder="只填这一层，如：饼干底">
              <p class="structure-error" data-structure-error aria-live="polite"></p>
            </div>
          </td>
          <td class="weight-cell">
            <span class="structure-mobile-label">重量(g)</span>
            <input data-structure-field="weight" value="${escapeAttr(row.weight || "")}" inputmode="decimal" aria-label="本层重量(g)" ${weightRequired ? "required" : ""} placeholder="${weightRequired ? "必填" : "蛋糕可不填"}">
          </td>
          <td class="percent-cell">
            <span class="structure-mobile-label">占比</span>
            <output class="structure-percent" data-structure-percent>${formatStructurePercent(numeric(row.weight), total)}</output>
          </td>
          <td class="action-cell">
            <span class="structure-mobile-label">操作</span>
            <button class="ghost-button danger" data-delete-structure="${escapeAttr(row.id)}" type="button">删除</button>
          </td>
        </tr>
      `).join("");
    }

          </div>

            <div class="${mainGridClass}">

              <input data-product-field="productName" data-product-required autocomplete="off" required value="${escapeAttr(productValue(product, "productName"))}" placeholder="如：香蕉布朗尼千层蛋糕">
            </div>
            <div>
              <label>版本 *</label>

              <label>产品规格（g） *</label>

              <textarea data-product-field="versionChange" data-product-required required placeholder="首版请写本次产品设计思路和逻辑；复样请写本版相较上一版改了什么。">${escapeAttr(productValue(product, "versionChange"))}</textarea>
            </div>
            <div>
              <label>核心原料及卖点 *</label>
              <textarea data-product-field="coreIngredientsSellingPoints" data-product-required required placeholder="核心原料、关键卖点或产品亮点，如产地、品种、科学宣称等。">${escapeAttr(productValue(product, "coreIngredientsSellingPoints"))}</textarea>
            </div>
            </div>
            <div class="span-3">
              <label>产品结构 *</label>
              <div class="structure-builder">
                <p class="structure-guidance" data-structure-guidance>填写顺序：从下到上。每一行只填一层；有下一层时，请点击“向上新增一层”。</p>
                <div class="structure-tools">
                  <button class="ghost-button" data-add-structure="${escapeAttr(product.id)}" type="button">向上新增一层</button>
                  <span class="weight-summary" data-total-weight>自动计算克重：0g</span>
                </div>
                <table class="structure-table" aria-label="产品结构明细">

                      <th>描述（从下至上依次是）</th>

                      <th class="action-cell">操作</th>

    function syncProductFromCard(productId) {
      const product = productById(productId);
      const card = productCard(productId);
      if (!product || !card) return;
      PRODUCT_FIELD_NAMES.forEach(name => {
        const input = card.querySelector(`[data-product-field="${name}"]`);
        if (input) product.fields[name] = input.value;
      });
      product.structures = [...card.querySelectorAll("[data-structure-id]")].map(row => ({
        id: row.dataset.structureId,
        name: row.querySelector('[data-structure-field="name"]')?.value || "",
        weight: row.querySelector('[data-structure-field="weight"]')?.value || ""
      }));
      if (!product.structures.length) product.structures = [{ id: rowId(), name: "", weight: "" }];
    }

    function syncAllProducts() {
      products.forEach(product => syncProductFromCard(product.id));
    }

    function updateProductSummary(productId) {
      const product = productById(productId);
      const card = productCard(productId);
      if (!product || !card) return;
      const total = structureTotal(product);
      const structureField = card.querySelector('[data-product-field="ingredientsStructure"]');
      const totalWeightText = card.querySelector("[data-total-weight]");
      const specCompareText = card.querySelector("[data-spec-compare]");
      card.querySelectorAll("[data-structure-id]").forEach(row => {
        const weight = numeric(row.querySelector('[data-structure-field="weight"]')?.value || "");
        const output = row.querySelector("[data-structure-percent]");
        if (output) output.textContent = formatStructurePercent(weight, total);
      });
      if (structureField) structureField.value = structureText(product);
      if (totalWeightText) totalWeightText.textContent = `自动计算克重：${formatWeight(total)}g`;
      const spec = specWeight(product);
      if (!spec || !total) {
        if (specCompareText) specCompareText.textContent = "";
        return;
      }
      const diff = total - spec;
      const sign = diff > 0 ? "+" : "";
      if (specCompareText) specCompareText.textContent = `产品规格 ${formatWeight(spec)}g；当前明细合计 ${formatWeight(total)}g；差异 ${sign}${formatWeight(diff)}g。`;
    }

    function renderProductPreview(productId) {
      const product = productById(productId);
      const card = productCard(productId);
      const preview = card?.querySelector("[data-image-preview]");
      if (!product || !preview) return;
      preview.innerHTML = (product.files || []).slice(0, 6).map((file, index) => `
        <figure>
          <img src="${URL.createObjectURL(file)}" alt="待上传产品照 ${index + 1}">
          <figcaption>${escapeAttr(file.name)}</figcaption>
        </figure>
      `).join("");
    }

    function renderProducts() {
      productsContainer.innerHTML = products.map(productHtml).join("");
      products.forEach(product => {
        updateProductSummary(product.id);
        renderProductPreview(product.id);
      });
      syncModeFieldState();
    }

    function productPayload(product, imagePaths = [], batchMetadata = {}) {
      const sharedSupplier = field("supplierName").value.trim();
      const sharedDate = field("sampleDate").value;
      const sharedProductType = field("productType").value;
      const sharedTestCategory = field("testCategory").value.trim();
      return {
        product_name: productValue(product, "productName").trim(),
        supplier_name: sharedSupplier,
        submission_batch_id: batchMetadata.submissionBatchId || null,
        batch_item_index: Number.isInteger(batchMetadata.batchItemIndex) ? batchMetadata.batchItemIndex : null,
        version_label: productValue(product, "versionLabel").trim(),
        sample_date: sharedDate,
        product_type: sharedProductType,
        test_category: sharedTestCategory,
        version_change: productValue(product, "versionChange").trim(),
        finished_spec: productValue(product, "finishedSpec").trim(),
        length_mm: productValue(product, "lengthMm").trim(),
        width_mm: productValue(product, "widthMm").trim(),
        height_mm: productValue(product, "heightMm").trim(),
        ingredients_structure: structureText(product).trim(),
        image_paths: imagePaths,
        core_ingredients_selling_points: productValue(product, "coreIngredientsSellingPoints").trim()
      };
    }

    function fileToImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    async function compressImage(file) {
      const rawDataUrl = await fileToImage(file);
      const img = new Image();
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = () => reject(new Error("图片无法读取，请使用 JPG、PNG 或 WebP 格式。"));
        img.src = rawDataUrl;
      });

      const maxSide = 1400;
      const ratio = Math.min(1, maxSide / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * ratio);
      canvas.height = Math.round(img.height * ratio);
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.78));
      return blob || file;
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(blob);
      });
    }

    async function cloudbaseImagePayloads(files) {
      const images = [];
      for (const file of [...(files || [])].slice(0, 6)) {
        const blob = await compressImage(file);
        images.push({
          name: file.name,
          type: "image/jpeg",
          dataUrl: await blobToDataUrl(blob)
        });
      }
      return images;
    }

    async function uploadImages(recordId, files, existingImages = []) {
      files = [...(files || [])].slice(0, 6);
      if (!files.length) return existingImages;
      const uploaded = [];
      for (const [index, file] of files.entries()) {
        const blob = await compressImage(file);
        const path = `supplier-feedback/${recordId}/${Date.now()}-${index + 1}.jpg`;
        const { error } = await client.storage
          .from(TABLE_BUCKET)
          .upload(path, blob, { cacheControl: "3600", upsert: false, contentType: "image/jpeg" });
        if (error) throw error;
        const { data } = client.storage.from(TABLE_BUCKET).getPublicUrl(path);
        uploaded.push({
          path,
          publicUrl: data.publicUrl,
          name: file.name,
          type: "image/jpeg",
          size: blob.size || file.size || 0
        });
      }
      return [...existingImages, ...uploaded].slice(0, 6);
    }

    function friendlyError(error) {
      const text = error?.message || String(error || "");
      if (text.includes("Failed to fetch")) return "网络请求失败。请检查当前网络后再提交；如果刚才上传了图片，请先去掉图片再提交一次。";
      if (text.includes("品名不能为空") || text.includes("供应商不能为空")) return text;
      return text || "提交失败。";
    }

    async function submitCreate() {
      syncAllProducts();
      validateProducts();
      const submissionBatchId = rowId();
      const payloads = products.map((product, index) => {
        const batchMetadata = { submissionBatchId, batchItemIndex: index };
        return {
          product,
          index,
          batchMetadata,
          payload: productPayload(product, [], batchMetadata)
        };
      });
      const missing = payloads.find(item => !item.payload.product_name || !item.payload.version_label);
      if (missing) throw new Error(`请填写产品 ${missing.index + 1} 的品名和版本。`);
      if (!payloads.length) throw new Error("请至少填写一个产品。");

      const results = [];
      for (const item of payloads) {
        if (cloudbaseReady) {
          const response = await cloudbaseRequest("submitSupplierFeedback", {
            payload: item.payload,
            images: await cloudbaseImagePayloads(item.product.files)
          });
        results.push({
          id: response.id,
          productName: item.payload.product_name,
          imageWarning: ""
        });
          continue;
        }
        const { data, error } = await client.rpc("submit_supplier_feedback", {
          p_payload: item.payload
        });
        if (error) throw error;
        let imageWarning = "";
        try {
          const images = await uploadImages(data.id, item.product.files, []);
          if (images.length) {
            const { error: updateError } = await client.rpc("update_supplier_feedback", {
              p_id: data.id,
              p_edit_token: data.edit_token,
              p_payload: productPayload(item.product, images, item.batchMetadata)
            });
            if (updateError) throw updateError;
          }
        } catch (error) {
            imageWarning = `图片没有上传成功：${friendlyError(error)}。基础信息已收到，图片可后续补充给产品负责人。`;
        }
        results.push({
          id: data.id,
          productName: item.payload.product_name,
          imageWarning
        });
      }
      return results;
    }

    async function resetFormAfterSubmit() {
      form.reset();
      products = [newProduct()];
      renderProducts();
    }

    addProductBtn.addEventListener("click", () => {

    });
    field("productType").addEventListener("change", () => {

    const composingStructureInputs = new WeakSet();

    function applyStructureDescriptionRule(input) {
      const normalized = String(input.value || "").normalize("NFKC");
      const filtered = normalizeStructureDescription(normalized);
      const error = input.closest("[data-structure-id]")?.querySelector("[data-structure-error]");
      input.value = filtered;
      if (error) {
        error.textContent = normalized === filtered
          ? ""
          : "每一行只能填写一层。请点击“向上新增一层”继续填写。";
      }
    }

    productsContainer.addEventListener("compositionstart", event => {
      if (event.target.matches('[data-structure-field="name"]')) composingStructureInputs.add(event.target);
    });
    productsContainer.addEventListener("compositionend", event => {
      if (!event.target.matches('[data-structure-field="name"]')) return;
      composingStructureInputs.delete(event.target);
      applyStructureDescriptionRule(event.target);
      const card = event.target.closest("[data-product-id]");
      if (!card) return;
      syncProductFromCard(card.dataset.productId);
      updateProductSummary(card.dataset.productId);
    });
    productsContainer.addEventListener("input", event => {
      const card = event.target.closest("[data-product-id]");
      if (!card) return;
      if (event.target.matches('[data-structure-field="name"]') && !composingStructureInputs.has(event.target)) {
        applyStructureDescriptionRule(event.target);
      }
      syncProductFromCard(card.dataset.productId);
      updateProductSummary(card.dataset.productId);
    });
    productsContainer.addEventListener("change", event => {
      const card = event.target.closest("[data-product-id]");
      if (!card) return;
      const product = productById(card.dataset.productId);
      if (event.target.matches("[data-product-images]") && product) {
        product.files = [...event.target.files].slice(0, 6);
        renderProductPreview(product.id);
        if (event.target.files.length > 6) showMessage("每个产品最多上传 6 张图片，本次只会提交前 6 张。");
        return;
      }
      syncProductFromCard(card.dataset.productId);
      updateProductSummary(card.dataset.productId);
    });
    productsContainer.addEventListener("click", event => {
      const addStructure = event.target.closest("[data-add-structure]");
      const deleteStructure = event.target.closest("[data-delete-structure]");
      const deleteProduct = event.target.closest("[data-delete-product]");
      if (addStructure) {
        syncAllProducts();
        const product = productById(addStructure.dataset.addStructure);
        if (product) product.structures.push({ id: rowId(), name: "", weight: "" });
        renderProducts();
        return;
      }
      if (deleteStructure) {
        const card = deleteStructure.closest("[data-product-id]");
        syncAllProducts();
        const product = productById(card?.dataset.productId);
        if (product) {
          product.structures = product.structures.filter(row => row.id !== deleteStructure.dataset.deleteStructure);
          if (!product.structures.length) product.structures.push({ id: rowId(), name: "", weight: "" });
        }
        renderProducts();
        return;
      }
      if (deleteProduct && products.length > 1) {
        syncAllProducts();
        products = products.filter(product => product.id !== deleteProduct.dataset.deleteProduct);
        renderProducts();
      }
    });
    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (SUPPLIER_FORM_MAINTENANCE) {
        showMessage("系统正在维护，请稍后，请 10 分钟之后再来。", "error");
        return;
      }
      if (!backendReady) {
        showMessage("后端尚未配置。请先配置 CloudBase 或 Supabase。", "error");
        return;
      }
      if (!form.reportValidity()) return;
      try {
        syncAllProducts();
        validateProducts();
        const confirmed = await confirmSubmission();
        if (!confirmed) return;
        submitBtn.disabled = true;
        submitBtn.textContent = "提交中...";
        const results = await submitCreate();
        await resetFormAfterSubmit();
        const warnings = results.map(result => result.imageWarning).filter(Boolean);
        showCreateResult(results, warnings);
      } catch (error) {
        showMessage(friendlyError(error), "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "提交";
      }
    });

    products = [newProduct()];
    renderProducts();
    if (SUPPLIER_FORM_MAINTENANCE) {
      showMessage("系统正在维护，请稍后，请 10 分钟之后再来。", "error");
      form.querySelectorAll("input, select, textarea, button").forEach(control => {
        control.disabled = true;
      });
      submitBtn.textContent = "维护中";
    }
    if (!backendReady) {
      showMessage("后端尚未配置。请先配置 CloudBase 或 Supabase。", "error");
    }
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
